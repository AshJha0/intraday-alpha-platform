# =============================================================================
# tools/github/issues.yaml — the single source of truth for the platform's
# GitHub epics, issues, labels and milestones.
#
# Rendered to docs/EPICS.md by
#     python3 tools/github/create_issues.py --render-md docs/EPICS.md
# applied to GitHub by
#     python3 tools/github/create_issues.py --apply --repo AshJha0/intraday-alpha-platform
# and validated by tests/integration/test_github_issue_plan.py.
#
# Status semantics (honest, checked against the repository, not the plan):
#   done         the component exists and the cited files / tests prove it
#   in-progress  being built in this release; `evidence` lists the PLANNED paths
#   backlog      not built; the issue says why and what would prove it
#
# Every issue body is assembled by the script from `context`, `acceptance`
# and `evidence`; acceptance boxes are pre-checked only for status: done.
# Terminology follows PLATFORM_CONVENTIONS.md: price_ticks, x-version, golden
# vectors, SplitMix64, fail-closed, EQ01..EQ12 / FX01..FX12.
# =============================================================================

version: 1
repo: AshJha0/intraday-alpha-platform

# ----------------------------------------------------------------------------
labels:
  # area:* — one per subsystem (mirrors CODEOWNERS ownership + docs/ARCHITECTURE.md §2)
  - {name: "area:contracts",     color: "0E8A16", description: "schemas/, canonical types, x-version, MIGRATIONS.md, typed contracts"}
  - {name: "area:marketdata",    color: "1D76DB", description: "seeded synthetic generator, normalization, QC, reference data"}
  - {name: "area:replay",        color: "1D76DB", description: "deterministic event-time replay, checkpoints, incident reproduction"}
  - {name: "area:orderbook",     color: "1D76DB", description: "L1/L2/MBO order book, consolidated book, sequencing"}
  - {name: "area:features",      color: "5319E7", description: "feature registry (205), native 40, labels"}
  - {name: "area:alpha",         color: "5319E7", description: "EQ01..EQ12 / FX01..FX12 alphas, linear_z_v1 scoring, fitted params"}
  - {name: "area:research",      color: "5319E7", description: "validation framework, ledger, ExperimentRunner, backtester"}
  - {name: "area:portfolio",     color: "0052CC", description: "mean-variance + tc optimizer, EWMA covariance, constraints"}
  - {name: "area:risk",          color: "B60205", description: "hard risk engine (fail-closed), kill switches, audit"}
  - {name: "area:execution",     color: "D93F0B", description: "TWAP/VWAP/POV/IS algos, SOR, event-driven execution simulator"}
  - {name: "area:tca",           color: "D93F0B", description: "transaction-cost analysis: IS decomposition, benchmarks, markouts"}
  - {name: "area:parity",        color: "FBCA04", description: "cross-language golden tests and the parity table"}
  - {name: "area:lifecycle",     color: "C2E0C6", description: "alpha promotion lifecycle RESEARCH..RETIRED and its gates"}
  - {name: "area:observability", color: "006B75", description: "metrics, alerts, dashboards, audit logs, decision trace"}
  - {name: "area:store",         color: "006B75", description: "data model: Parquet/JSON tiers, SQL DDL, SQLite store"}
  - {name: "area:mvp",           color: "0E8A16", description: "python -m iap.mvp end-to-end loop"}
  - {name: "area:testing",       color: "FBCA04", description: "the six-level testing strategy and CI harness"}
  - {name: "area:ml",            color: "5319E7", description: "gated model zoo, meta-labeling, model manifests"}
  - {name: "area:adaptive",      color: "5319E7", description: "PSI/KS drift, rolling IC, refit policies"}
  - {name: "area:performance",   color: "D4C5F9", description: "hot-path engineering, benchmarks, SPSC queues"}
  - {name: "area:deployment",    color: "006B75", description: "docker/k8s/prometheus/grafana, production hardening"}
  - {name: "area:repo",          color: "BFDADC", description: "CI, governance, templates, contributor tooling"}
  - {name: "area:agentic",       color: "BFDADC", description: "read-only AI/MCP research layer, never on the trading path"}
  # lang:*
  - {name: "lang:python", color: "3572A5", description: "python/src/iap (reference implementation + research)"}
  - {name: "lang:cpp",    color: "F34B7D", description: "cpp/ (latency-critical path, execution reference)"}
  - {name: "lang:rust",   color: "DEA584", description: "rust/ (safety-critical: risk reference, event bus, venue sim)"}
  - {name: "lang:java",   color: "B07219", description: "java/ com.iap.* (platform layer, paper trading)"}
  # type:*
  - {name: "type:epic",     color: "3E4B9E", description: "a body of work with child issues and a task list"}
  - {name: "type:feature",  color: "A2EEEF", description: "new or ported capability"}
  - {name: "type:bug",      color: "D73A4A", description: "a defect against a pinned contract or golden"}
  - {name: "type:research", color: "D876E3", description: "a ledgered experiment with a hypothesis and a verdict"}
  - {name: "type:docs",     color: "0075CA", description: "documentation, contracts, runbooks"}
  # priority:*
  - {name: "priority:p0", color: "B60205", description: "blocks the release or a safety property"}
  - {name: "priority:p1", color: "E99695", description: "needed for the current milestone"}
  - {name: "priority:p2", color: "F9D0C4", description: "backlog; scheduled when capacity allows"}
  # status:*
  - {name: "status:done",        color: "0E8A16", description: "exists in the repository; evidence cited in the issue"}
  - {name: "status:in-progress", color: "FBCA04", description: "being built in this release; planned paths cited"}
  - {name: "status:backlog",     color: "C5DEF5", description: "not built; scope and proof-of-done written down"}
  - {name: "status:partial",     color: "BFD4F2", description: "epics only (derived): some issues done, the rest backlog, nothing in flight"}
  # phase:*
  - {name: "phase:0",      color: "EDEDED", description: "Phase 0 — architecture and contracts"}
  - {name: "phase:w1",     color: "EDEDED", description: "Week 1 — market data + deterministic replay"}
  - {name: "phase:w2",     color: "EDEDED", description: "Week 2 — order book + feature engine"}
  - {name: "phase:w3",     color: "EDEDED", description: "Week 3 — alpha engine + research framework"}
  - {name: "phase:w4",     color: "EDEDED", description: "Week 4 — portfolio construction + hard risk"}
  - {name: "phase:w5",     color: "EDEDED", description: "Week 5 — execution, SOR, simulator, performance"}
  - {name: "phase:w6",     color: "EDEDED", description: "Week 6 — TCA, parity, lifecycle, trace, store, MVP"}
  - {name: "phase:phase2", color: "EDEDED", description: "Phase 2 — research platform (alpha factory, ML, adaptive)"}
  - {name: "phase:phase3", color: "EDEDED", description: "Phase 3 — production engineering (documented, out of scope)"}

# ----------------------------------------------------------------------------
milestones:
  - title: "Phase 0"
    description: "Architecture and contracts: canonical types, the schema set with x-version, wire formats, the deterministic-replay contract, repository governance and CI."
  - title: "Week 1"
    description: "Market data + deterministic replay: the seeded synthetic generator (trades, quotes, depth, venue books, clustered flow, vol regimes, auctions, halts, feed anomalies), normalization/QC, and same-seed => bit-identical output."
  - title: "Week 2"
    description: "Order book (integer ticks, L1/L2/MBO, consolidated) and the feature engine (205-feature registry, native 40 ported to C++/Rust/Java)."
  - title: "Week 3"
    description: "Alpha engine (EQ01..EQ12, FX01..FX12) and the research framework (walk-forward with purging and embargo, leakage tests, multiple-testing ledger, hypothesis sign, costs, capacity, ExperimentRunner)."
  - title: "Week 4"
    description: "Portfolio construction (mean-variance + transaction cost, projected gradient, constraints) and the fail-closed hard risk engine with kill switches."
  - title: "Week 5"
    description: "Execution algorithms (TWAP/VWAP/POV/IS), smart order routing with venue scoring, the event-driven execution simulator (queue position, partial fills, cancels), and the performance architecture."
  - title: "Week 6"
    description: "TCA, cross-language parity, the alpha promotion lifecycle, decision trace, the SQL data model, the end-to-end MVP loop and the six-level testing strategy."
  - title: "Phase 2"
    description: "Research platform: alpha factory on top of the ExperimentRunner, gated ML layer and meta-labeling, adaptive drift/refit machinery."
  - title: "Phase 3"
    description: "Production engineering — real feeds, HA, kernel bypass, regulatory controls. Documented as out of scope for this repository; tracked so the boundary is explicit."
  - title: "Backlog"
    description: "Unscheduled work with a written scope and proof-of-done, including the read-only agentic/MCP research layer."

# ----------------------------------------------------------------------------
epics:
  - key: E01
    title: "Epic: Architecture and contracts"
    labels: [type:epic, area:contracts, phase:0, priority:p0]
    milestone: "Phase 0"
    objective: >
      Pin every cross-language decision before any port is written: canonical
      integer types, the versioned JSON Schema contract set, two wire formats
      with byte-exact parity, version identity that propagates end to end, and
      the determinism rules every deterministic path must obey.
    scope:
      - "PLATFORM_CONVENTIONS.md §1-§3 and the seven original contracts under schemas/<domain>/"
      - "JSONL + IAP1 binary formats (schemas/FORMAT.md) with the shared reject fixture"
      - "x-version discipline and schemas/MIGRATIONS.md"
      - "Typed Python contracts + protocols and the nine new schemas for the MVP loop"
    acceptance:
      - "Every contract carries x-version and a MIGRATIONS.md entry per change"
      - "IAP1 encodings of the golden vectors are SHA-256-identical in Python, C++, Rust and Java"
      - "No float on any contract or hot path: price_ticks / qty / ns timestamps are int64"
      - "The new MVP contracts (portfolio_target .. risk_decision) are schema-pinned and consumed by python/src/iap/contracts"
    out_of_scope:
      - "Real venue protocols (ITCH/OUCH/FIX) — Phase 3"

  - key: E02
    title: "Epic: Repository engineering, CI and governance"
    labels: [type:epic, area:repo, phase:0, priority:p1]
    milestone: "Phase 0"
    objective: >
      Make the engineering discipline enforceable: one CI workflow that runs
      the canonical commands, a harness that prints the parity table,
      governance documents that name the promotion gates and audit policy,
      and contributor tooling (templates, CONTRIBUTING.md, this issue plan).
    scope:
      - ".github/workflows/ci.yml, tests/harness/run_all.sh, check_headline_numbers.py"
      - "docs/governance/, CODEOWNERS"
      - ".github/ISSUE_TEMPLATE, PULL_REQUEST_TEMPLATE.md, CONTRIBUTING.md, tools/github/"
    acceptance:
      - "CI runs every language suite, the repo-level suites, the golden gate and the deployment checks"
      - "Headline numbers in README are re-derived from artefacts by a check that fails CI when a platform number drifts"
      - "Issues and PRs are filed through templates that ask for the platform's own evidence (goldens, x-version, ledger ids)"
    out_of_scope:
      - "Hosted project boards / automation beyond the gh CLI"

  - key: E03
    title: "Epic: Synthetic market data generator and normalization"
    labels: [type:epic, area:marketdata, phase:w1, priority:p0, lang:python]
    milestone: "Week 1"
    objective: >
      A seeded generator that produces realistic multi-venue equity MBO and FX
      quote/trade streams — regime-switching price, clustered flow, FIFO queue
      dynamics, auctions, halts and injected feed anomalies — followed by a
      normalization stage that validates sequences and writes the canonical
      dataset with a QC report that anchors data_version.
    scope:
      - "python/src/iap/marketdata/{generator,normalize,golden_anomalies}.py and configs/marketdata/generator.json"
      - "reference data service (instruments, venues, sessions, calendar)"
    acceptance:
      - "Same seed => byte-identical raw and normalized files (JSONL, IAP1, SHA-256)"
      - "qc_report.json counts gaps, duplicates, out-of-order, invalid and ts-clamped events"
      - "The golden vectors events_eq_mbo.jsonl / events_fx_quote.jsonl and the anomaly vectors are produced by this generator"
    out_of_scope:
      - "Real market data, real calendars, corporate actions (Phase 3)"

  - key: E04
    title: "Epic: Deterministic replay as a flagship feature"
    labels: [type:epic, area:replay, phase:w1, priority:p0]
    milestone: "Week 1"
    objective: >
      Replay is the platform's regression mechanism: event-time replay engines
      in all four languages, cross-language checkpoints, execution replay with
      exact fills, and paper-trading state recovery — so an incident can be
      captured, replayed, reproduced, fixed and turned into a regression test.
    scope:
      - "python/src/iap/replay, cpp/include/iap/replay, rust/replay, java com.iap.replay"
      - "checkpoint x-version 2 documents; paper-trading --resume"
      - "tests/replay (same seed => identical bytes)"
    acceptance:
      - "Replay from any checkpoint reaches states identical to an uninterrupted run, in every language"
      - "tests/replay proves byte-identical regeneration of the golden vector"
      - "An incident-capture -> replay -> regression-test loop is documented and tooled"
    out_of_scope:
      - "Replay of real venue captures (no real feed handlers exist)"

  - key: E05
    title: "Epic: Order book with integer ticks (L1/L2/MBO)"
    labels: [type:epic, area:orderbook, phase:w2, priority:p0]
    milestone: "Week 2"
    objective: >
      One pinned order-book semantics — MBO FIFO queues, status-gated matching,
      a single malformed-event policy with named counters, sequence
      gap/reorder/reset handling and a consolidated multi-venue view —
      implemented four times and held identical by exact-integer goldens.
    scope:
      - "python/src/iap/orderbook/book.py (reference, brute-force validated), cpp orderbook, rust/orderbook, java com.iap.orderbook"
      - "goldens: expected_book_states.json, expected_anomaly_states.json, expected_checkpoint_eq_1000.json"
    acceptance:
      - "All prices are int64 price_ticks; arithmetic on feed-controlled values is checked, never wrapped"
      - "applied + drops + held == events fed, in every language, on the anomaly vectors"
      - "Book states after the pinned event indices match exactly across the four languages"
    out_of_scope:
      - "Matching-engine simulation of hidden/iceberg order types"

  - key: E06
    title: "Epic: Feature engine (native 40, registry 205)"
    labels: [type:epic, area:features, phase:w2, priority:p0]
    milestone: "Week 2"
    objective: >
      An event-driven feature factory: a versioned registry of 205 features in
      10 families whose canonical hash is feature_version, a Python reference
      engine computing all of them with explicit validity, and the pinned
      40-feature native core ported to C++/Rust/Java at 1e-9 parity, plus
      event-time labels at 11 horizons.
    scope:
      - "python/src/iap/features (10 family modules, registry, engine, rolling primitives), python/src/iap/labels"
      - "cpp features, rust/features, java com.iap.features; API_FEATURES.md"
    acceptance:
      - "data/reference/feature_registry.json lists 205 features with name/family/version/params/doc/depends_on"
      - "NaN never leaks into a valid=true value; warmup and stale book => invalid"
      - "expected_features.json and expected_features_anomalies.json match in all four languages at abs/rel 1e-9"
    out_of_scope:
      - "Porting all 205 features to the native engines (backlog; ported on demand)"

  - key: E07
    title: "Epic: Alpha engine — 24 flagship alphas"
    labels: [type:epic, area:alpha, phase:w3, priority:p0]
    milestone: "Week 3"
    objective: >
      EQ01..EQ12 and FX01..FX12 as an alpha library with an enforced economic
      rationale per alpha, linear_z_v1 fitting with provenance, six golden
      production alphas ported to C++/Rust/Java, and an honest promotion report
      — currently 0 PROMOTE / 10 ITERATE / 14 REJECT on uncrossed IC.
    scope:
      - "python/src/iap/alpha/{base,equity,fx,cross_sectional,fx_exposure,data}.py"
      - "configs/strategies/alpha_params.json (x-version 2), API_ALPHA.md, research/alpha_reports/"
    acceptance:
      - "Every alpha class carries an `Economic rationale:` docstring; a sign contradiction can at best be ITERATE"
      - "expected_alpha.json matches in C++/Rust/Java for the six golden alphas"
      - "REPORT.md prints costs, uncrossed IC, degenerate-fold counts and the multiple-testing denominator for all 24"
    out_of_scope:
      - "Any claim about real markets — every result is a statement about the synthetic dataset"

  - key: E08
    title: "Epic: Research framework — validation, ledger, ExperimentRunner"
    labels: [type:epic, area:research, phase:w3, priority:p0, lang:python]
    milestone: "Week 3"
    objective: >
      Honest research machinery: walk-forward with purging and embargo,
      automatic leakage tests, IC/RankIC/t-stat/hit/decay/turnover/capacity,
      a multiple-testing ledger with Bonferroni and expected-max-|t|, the
      hypothesis-sign gate, cost and stress survival, and an ExperimentRunner
      that turns a spec into a reproducible result document.
    scope:
      - "python/src/iap/validation, python/src/iap/experiment, python/src/iap/backtest"
      - "python/src/iap/research (ExperimentRunner) and research/experiments/<id>/{spec,result}.json"
    acceptance:
      - "No random splits anywhere; every fold is event-time, purged and embargoed"
      - "Shift-by-one destroys IC for every alpha (leakage test) and the label-column guard passes"
      - "Every look is counted in research/experiments.json; every report prints the denominator"
      - "ExperimentRunner ids are the SHA-256 of the canonical spec and reruns are byte-identical"
    out_of_scope:
      - "Full deflated Sharpe ratio with skew/kurtosis; Harvey-Liu-Zhu p-values (backlog)"

  - key: E09
    title: "Epic: Portfolio construction"
    labels: [type:epic, area:portfolio, phase:w4, priority:p1]
    milestone: "Week 4"
    objective: >
      Deterministic mean-variance construction with transaction costs solved by
      pinned projected gradient under explicit constraints, EWMA covariance
      from 1-minute bars, FX currency-exposure translation, and a Java port
      matched at 1e-9.
    scope:
      - "python/src/iap/portfolio/{optimizer,covariance,fx,diagnostics}.py; java com.iap.portfolio; API_PORTFOLIO_TCA.md §1"
    acceptance:
      - "Objective alpha'w - lambda w'Sigma w - sum tc |w - w_prev| with L1-ball projection; INFEASIBLE returns w_prev, never NaN"
      - "expected_portfolio.json matches in Java at 1e-9 and was validated against an SLSQP optimum"
    out_of_scope:
      - "Factor risk models beyond EWMA covariance"

  - key: E10
    title: "Epic: Hard risk engine (fail-closed)"
    labels: [type:epic, area:risk, phase:w4, priority:p0]
    milestone: "Week 4"
    objective: >
      A deterministic pre-trade and post-fill risk engine with a pinned check
      order, kill switches at four scopes, latching loss limits with a pinned
      re-arm precedence, currency-aware notional, snapshot/restore, and a
      byte-identical audit log. The engine depends on nothing but its config
      and the event stream — never on a network call, a wall clock or an LLM.
    scope:
      - "rust/risk (reference), java com.iap.risk (byte-identical port), python/src/iap/risk (port in progress)"
      - "configs/risk/risk.json (x-version 3), schemas/risk/risk_event.schema.json"
    acceptance:
      - "Missing or invalid config rejects everything with CONFIG_MISSING; unbootstrapped engines reject with NOT_BOOTSTRAPPED"
      - "expected_risk_decisions.json / expected_risk_snapshot.json / expected_risk_audit.jsonl match exactly in every port"
      - "rust/risk depends on serde/serde_json only; no wall clock on any decision path"
    out_of_scope:
      - "Regulatory rulebooks (SEC 15c3-5 / MiFID II RTS 6) — Phase 3"
      - "A C++ risk port (deliberately not built: Rust is the reference, Java the port)"

  - key: E11
    title: "Epic: Execution algorithms, SOR and execution simulator"
    labels: [type:epic, area:execution, phase:w5, priority:p0]
    milestone: "Week 5"
    objective: >
      Parent-order algorithms (TWAP/VWAP/POV/IS) sliced into children with
      time-in-force, a deterministic smart order router with a pinned venue
      scoring ladder, and an event-driven execution simulator with seeded
      latency, queue position, partial fills, cancels and a venue trading-state
      gate — C++ is the reference, Java the port, Python the port in progress.
    scope:
      - "cpp/include/iap/execution/{execution,algos}.hpp, cpp/include/iap/sor/sor.hpp (+ src); java com.iap.{execution,sor}; python/src/iap/execution"
      - "rust/venue (venue protocol codec + simulated venue)"
    acceptance:
      - "The nine pinned rules in execution.hpp are the contract and each is tested in every implementing language"
      - "expected_replay_fills.json (generated by C++) matches exactly in Java and Python"
      - "NO_ROUTE never falls back to a stale venue; every child carries expire_ts = parent.end_ts"
    out_of_scope:
      - "A Rust execution crate (by design: C++ is the execution reference)"
      - "Closed-form Almgren-Chriss trajectories (backlog)"

  - key: E12
    title: "Epic: Performance architecture"
    labels: [type:epic, area:performance, phase:w5, priority:p1]
    milestone: "Week 5"
    objective: >
      Hot paths built for predictability: fixed-size structures mirroring the
      72-byte IAP1 record, preallocated pools with no allocation after warmup,
      an SPSC ring buffer, allocation-conscious Java, and benchmark numbers
      reported honestly as single-threaded means on a 2-CPU container.
    scope:
      - "cpp/ hot path + cpp/bench/bench_all.cpp; rust/eventbus; java hot paths + GC metrics; benchmarks/"
    acceptance:
      - "No allocation in C++ book/feature hot loops after warmup, enforced by tests"
      - "benchmarks/RESULTS.md states the methodology (2 CPUs, no pinning, mean-only, single-threaded) next to every number"
    out_of_scope:
      - "Tick-to-trade on a real network, kernel bypass (Phase 3)"

  - key: E13
    title: "Epic: Transaction-cost analysis"
    labels: [type:epic, area:tca, phase:w6, priority:p1]
    milestone: "Week 6"
    objective: >
      Parent-order TCA against arrival, interval VWAP and TWAP; Perold
      implementation shortfall decomposed exactly into delay, trading and
      opportunity; spread, impact, fees, fill rate and adverse-selection
      markouts; a Java service matched at 1e-9 and a deterministic report.
    scope:
      - "python/src/iap/tca/{tca,fills,simulator,report}.py; java com.iap.tca; research/tca/; API_PORTFOLIO_TCA.md §2"
    acceptance:
      - "delay + trading + opportunity == total IS exactly for every order"
      - "Crossed consolidated states are skipped and counted; markouts across a HALT are null, never a stale mid"
      - "expected_tca.json matches in Java at 1e-9"
    out_of_scope:
      - "Real fee schedules and impact models (Phase 3)"

  - key: E14
    title: "Epic: Cross-language parity (golden tests Python == C++ == Rust == Java)"
    labels: [type:epic, area:parity, phase:w6, priority:p0]
    milestone: "Week 6"
    objective: >
      Four independent implementations of one pinned semantics, held identical
      by golden vectors: each domain's reference generates the goldens, every
      other language must load and match, and one harness prints the parity
      table that gates promotion.
    scope:
      - "tests/golden/, python/tools/make_golden*.py, cpp/tools/make_replay_fills_golden.cpp, rust/risk/src/bin/make_risk_golden.rs"
      - "tests/harness/run_all.sh, run_golden.sh"
    acceptance:
      - "Every language has a golden test group and the harness exits 0 iff all rows PASS"
      - "Tolerances are pinned: SHA-256 byte-exact (codec), exact integers (book/risk/fills), 1e-9 (features/alpha/portfolio/TCA), 1e-10 (PSI/KS)"
      - "Goldens are regenerated only by the owning reference tool with a MIGRATIONS.md entry"
    out_of_scope:
      - "Parity for components a language deliberately does not implement (see docs/ARCHITECTURE.md §10)"

  - key: E15
    title: "Epic: Alpha promotion lifecycle"
    labels: [type:epic, area:lifecycle, phase:w6, priority:p0]
    milestone: "Week 6"
    objective: >
      A seven-state alpha lifecycle RESEARCH -> CANDIDATE -> VALIDATING -> PAPER
      -> ACTIVE -> WATCH -> RETIRED with a pinned gate per transition, an alpha
      registry, a golden state-sequence test and ports in Java/Rust/C++ —
      extending the existing IC-gated ACTIVE/WATCH/RETIRED machinery.
    scope:
      - "python/src/iap/adaptive/lifecycle.py (existing 3-state), python/src/iap/lifecycle (7-state + registry), ports"
      - "schemas lifecycle_transition; research/lifecycle_log.jsonl; docs/LIFECYCLE.md"
    acceptance:
      - "No transition without its gate evidence; a PR cannot flip a verdict without the ledger entry id"
      - "State sequences are golden-tested and identical across the ports"
      - "RETIRED halts allocation in the backtest today; making it an allocation gate in the live loop is tracked"
    out_of_scope:
      - "Written risk approval as an automated gate (remains a human sign-off recorded in the audit log)"

  - key: E16
    title: "Epic: Observability and the decision trace"
    labels: [type:epic, area:observability, phase:w6, priority:p1]
    milestone: "Week 6"
    objective: >
      See what the platform did and why: Prometheus metrics with a pinned name
      contract, alerts with unit tests, dashboards, byte-identical audit logs —
      and a decision trace that links signal -> decision -> order -> execution
      -> P&L with an explain() that answers "why did this order happen".
    scope:
      - "java com.iap.{monitoring,api}, rust/telemetry, deployment/prometheus, deployment/grafana"
      - "python/src/iap/trace (+ Java/Rust/C++ ports), schemas decision_trace, docs/DECISION_TRACE.md"
    acceptance:
      - "Every counter/histogram name follows the telemetry contract and every dashboard metric has a producer"
      - "A decision trace reconstructs one order's causal chain from a single trace id, deterministically"
    out_of_scope:
      - "Distributed tracing infrastructure (OpenTelemetry collectors)"

  - key: E17
    title: "Epic: Data model and store"
    labels: [type:epic, area:store, phase:w6, priority:p1]
    milestone: "Week 6"
    objective: >
      The platform's persistent records — experiments, lifecycle transitions,
      orders, executions, TCA results, decision traces — get a
      SQLite/Postgres-portable DDL and a Python store, alongside the existing
      Parquet/JSON file tiers.
    scope:
      - "schemas/sql/*.sql, python/src/iap/store, docs/DATA_MODEL.md"
    acceptance:
      - "DDL applies unchanged on SQLite and is Postgres-portable (documented type mapping)"
      - "Every record type has a schema, a table and a round-trip test"
    out_of_scope:
      - "kdb+/Aeron-class infrastructure (spec §§23-24, single-machine scale by design)"

  - key: E18
    title: "Epic: End-to-end MVP loop"
    labels: [type:epic, area:mvp, phase:w6, priority:p0, lang:python]
    milestone: "Week 6"
    objective: >
      One command runs the whole loop on one instrument — generate -> book ->
      features -> alpha -> portfolio target -> risk -> execution -> TCA ->
      trace — and running it twice produces identical bytes.
    scope:
      - "python -m iap.mvp --seed 12345 --instrument SYN.EQ.AAPL; docs/MVP.md; docs/ROADMAP.md"
    acceptance:
      - "The MVP run writes a report and a trace; a second run with the same seed is byte-identical (golden)"
      - "Every stage consumes a typed contract from python/src/iap/contracts"
    out_of_scope:
      - "Multi-instrument portfolios in the MVP command (the Java paper loop covers the full universe)"

  - key: E19
    title: "Epic: Six-level testing strategy"
    labels: [type:epic, area:testing, phase:w6, priority:p0]
    milestone: "Week 6"
    objective: >
      Unit, golden, replay, integration, research validation and deployment —
      six levels with exact commands, all run by CI, with property-style tests
      inside the unit suites and counts printed truthfully by the harness.
    scope:
      - "tests/README.md, tests/{golden,replay,integration,harness}, per-language suites, .github/workflows/ci.yml"
    acceptance:
      - "Each level has a README-documented command and a CI job"
      - "A test is never deleted or skipped to get green; `-`/`?` counts fail the harness"
    out_of_scope:
      - "Mutation testing"

  - key: E20
    title: "Epic: ML layer — gated model zoo and meta-labeling"
    labels: [type:epic, area:ml, phase:phase2, priority:p1, lang:python]
    milestone: "Phase 2"
    objective: >
      Advanced models earn their run: a tiered zoo (linear -> trees -> MLP)
      gated on a linear baseline's out-of-sample IC, meta-labeling with
      calibrated probabilities, and manifests that pin every fit's data,
      feature and model versions.
    scope:
      - "python/src/iap/models/{zoo,pipeline,metalabel,dataset,splits,economics}.py; research/ml_reports/; research/models/"
    acceptance:
      - "Tree/MLP tiers run only when the linear gate passes; the gate reads the mid-to-mid label"
      - "Every fit has a manifest with git commit, data_version, feature_version, model_version, hyperparameters, windows, hardware"
    out_of_scope:
      - "Deep sequence models; GPU training"

  - key: E21
    title: "Epic: Adaptive layer — drift, refit policies"
    labels: [type:epic, area:adaptive, phase:phase2, priority:p1]
    milestone: "Phase 2"
    objective: >
      Treat decay as first-class: PSI/KS feature drift, rolling realized-vs-
      research IC, static/scheduled/drift-triggered refit policies, a
      deployment backtest that replays them without lookahead, and live
      Java monitors fed from the same baseline files the research used.
    scope:
      - "python/src/iap/adaptive/{drift,refit,lifecycle}.py, python/src/iap/backtest/adaptive.py; java com.iap.adaptive; API_ADAPTIVE.md; research/adaptive_reports/"
    acceptance:
      - "PSI/KS at 1e-10, refit decisions as exact booleans and lifecycle sequences as exact states in the adaptive golden"
      - "Live monitors are observational and never feed back into an in-session decision"
    out_of_scope:
      - "Online learning inside the trading loop"

  - key: E22
    title: "Epic: Research platform — alpha factory"
    labels: [type:epic, area:research, phase:phase2, priority:p2, lang:python]
    milestone: "Phase 2"
    objective: >
      Turn the research framework into a factory: spec-driven batches through
      the ExperimentRunner, automatic ledger entries, cross-alpha correlation
