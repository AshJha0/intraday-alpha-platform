      RefitPolicy variants are pure functions of event time and monitor
      values, built from the pinned adaptive block in
      configs/strategies/strategies.json (validate_adaptive_config rejects
      inconsistent blocks). The deployment backtest does a warmup fit +
      baseline capture, block-wise evaluation, refits on trailing purged/
      embargoed windows with no-lookahead asserted at runtime and shift-
      tested, and RETIRED forcing positions flat while shadow scoring
      continues.
    acceptance:
