    acceptance:
      - "Every out-of-scope item has an issue stating what would prove it done"
      - "The existing deployment stack passes tests/harness/check_deployment.py"
    out_of_scope:
      - "Actually building these in this repository"

  - key: E24
    title: "Epic: Agentic AI / MCP research layer (read-only)"
    labels: [type:epic, area:agentic, priority:p2, phase:phase2]
    milestone: "Backlog"
    objective: >
