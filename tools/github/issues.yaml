  - key: AD04
    epic: E21
    title: "Adaptive policy study: 4 policies x 10 alphas, 126 drift-triggered refits, no policy beats static"
    labels: [type:research, area:adaptive, phase:phase2, priority:p1, lang:python]
    milestone: "Phase 2"
    status: done
    estimate_days: 2
    context: >
      Hypothesis: drift-triggered refits outperform static parameters as
      alphas decay. Result on two synthetic sessions: weekly scheduling
      cannot fire once, P&L differences between policies are one to two
      orders of magnitude smaller than the cost drag, FX01 finishes RETIRED
      under every policy; the machinery is deterministic and leak-free, and
      ranking policies would take months of sessions — the report says so.
    acceptance:
      - "ADAPTIVE_REPORT.md prints every look, every transition and the limits of the evidence"
    evidence:
      - "research/adaptive_reports/ADAPTIVE_REPORT.md; research/adaptive_reports/run_adaptive.py; research/adaptive_reports/*_adaptive.json; research/lifecycle_log.jsonl"

