      Two sessions cannot rank policies (the report proves it). Hypothesis:
      with N >= 20 seeded sessions and an injected regime shift at a known
      session, drift-triggered refits recover IC faster than scheduled ones.
      Expected sign: positive IC difference after the shift. Runs through the
      ExperimentRunner and the ledger.
    acceptance:
      - "Generator config for N sessions with a scheduled regime shift; the study reruns byte-identically"
      - "Report states power (minimum detectable P&L difference) before the ranking"
    evidence:
      - "research/adaptive_reports/ADAPTIVE_REPORT.md (what two sessions cannot prove); configs/marketdata/generator.json (sessions)"

