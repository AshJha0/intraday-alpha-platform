# Dependabot version updates. Weekly, one ecosystem per directory that actually
# holds a manifest. Updates arrive as PRs and go through the normal CI gate;
# Actions are SHA-pinned in the workflows, and Dependabot rewrites the SHA and
# the trailing version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /deployment/docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The image Python minor is a deliberate, tested move (CI matrix, hashed
      # requirements-image.txt, wheels for numpy/scipy). 3.15 has no numpy/scipy wheels yet.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
