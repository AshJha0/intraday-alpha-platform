name: Feature
description: A new or ported capability against a pinned contract (mirrors tools/github/issues.yaml `issues:`).
title: "<component>: <what changes>"
labels: ["type:feature"]
body:
  - type: input
    id: epic
    attributes:
      label: Epic
      description: "`Part of #N` or the plan key (E01..E24, see docs/EPICS.md)."
      placeholder: "Part of #12"
    validations:
      required: true
  - type: dropdown
    id: languages
    attributes:
      label: Language(s)
      multiple: true
      options: [python, cpp, rust, java]
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: done = exists and the evidence proves it; in-progress = being built, planned paths listed; backlog = not built.
      options: [backlog, in-progress, done]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Which contract clause or spec section this serves (PLATFORM_CONVENTIONS.md §, API_*.md §, docs/SPECIFICATION.md §). Why now.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist; each item provable by a file, a test or a golden vector.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contracts and goldens touched
      description: |
        Which schemas change (x-version bump + schemas/MIGRATIONS.md entry?), which golden files are added or
        regenerated and by which reference tool (python/tools/make_golden*.py, cpp/tools/make_replay_fills_golden,
        rust/risk/src/bin/make_risk_golden), and which languages must re-match.
      placeholder: |
        schemas/order/child_order.schema.json  x-version 1 -> 2  (MIGRATIONS.md entry)
        tests/golden/expected_replay_fills.json  regenerated by cpp/tools/make_replay_fills_golden; Java + Python re-match
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / planned paths
      description: For done, the exact files and tests that prove it; otherwise the planned module and test paths.
      placeholder: |
        python/src/iap/execution/simulator.py
        python/tests/test_execution_golden.py
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate (days)
      placeholder: "2"
    validations:
      required: true
  - type: checkboxes
    id: determinism
    attributes:
      label: Determinism
      options:
        - label: No wall clock and no unordered-map iteration on any deterministic path this touches (PLATFORM_CONVENTIONS.md §3)
        - label: Any randomness comes from SplitMix64 with a seed from configs/
