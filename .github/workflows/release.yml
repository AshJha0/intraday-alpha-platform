# =============================================================================
# release — on a v* tag: build the three images, push them to GHCR, record
# the image digests in release-manifest.json, attest build provenance for
# each image, and attach the manifest to the GitHub release.
#
# SBOMs (v1.17, F1): a CycloneDX SBOM per image (syft, from the pushed
# image by digest; attested with actions/attest-sbom and pushed to the
# registry next to the provenance) and one per hashed Python lock file
# (cyclonedx-bom, requirements-image.txt = what the python image installs,
# requirements-ci.txt = what CI tests against; attested with the lock file as
# subject). All of them are release assets: sbom-image-{python,cpp,rust}.cdx.json,
# sbom-python-requirements-{image,ci}.cdx.json.
#
#   images:  ghcr.io/ashjha0/intraday-alpha-platform-{python,cpp,rust}:<tag>
#   manifest: release-manifest.json  (tag, commit, per-image reference+digest;
#             schema: {tag, commit, built_at, images: [{language, name,
#             digest, reference}]} with exactly three images since v1.17 —
#             the java image was retired, WS-F item F9 / DECISION_N7)
#
# The release is created if it does not exist yet (generated notes); an
# existing release keeps its notes, only the manifest asset is added/replaced.
# The tag's commit must already have a green `ci` run: the images are the
# artefact of a tree whose full suite and golden gate passed (GOVERNANCE
# promotion gate 10). The guard is tests/harness/verify_ci_green.py: it
# retries an API that does not answer (up to 10 consecutive failures, about
# ten minutes), fails at once when ci ran and did not succeed, waits up to
# 40 minutes for a run that is still in progress, and fails after a 2-minute
# grace when no run exists. It prints what it saw on every attempt.
#
# Digest pinning (v1.17 F2, the release step for deployment/): after the
# workflow finishes, `python tools/release.py publish --version X.Y.Z`
# downloads release-manifest.json from the release and rewrites the
# Kubernetes manifests (deployment/k8s/{platform-metrics,cronjob-data-pipeline,
# cronjob-state-backup}.yaml) to <name>:<tag>@<digest> (`pin-digests` runs
# that step alone, dry-run by default); compose keeps the tag because a
# `build:` service cannot carry a digest. Verify provenance with:
#   gh attestation verify oci://ghcr.io/ashjha0/intraday-alpha-platform-python@<digest> \
#     --repo AshJha0/intraday-alpha-platform
#
# Dry run (workflow_dispatch): runs ONLY the verify-ci guard, against the
# commit given as `sha`. No image is built or pushed and no release is
# written — the `images` and `manifest` jobs run on tag pushes alone. It is
# how the guard is exercised without a tag:
#   gh workflow run release.yml --ref <branch> -f dry_run=true -f sha=<40 hex>
# =============================================================================
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run only the verify-ci guard (no image push, no release write). Must stay true: a release is made by pushing a tag."
        type: boolean
        default: true
      sha:
        description: "Commit whose ci run the guard checks (full 40-hex id)"
        type: string
        required: true

concurrency:
  group: release-${{ github.ref }}-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-ci:
    runs-on: ubuntu-24.04
    # 40 min for a ci run still in progress + the API retry budget + slack.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: a manual run is a dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "::error::workflow_dispatch only runs the verify-ci guard (dry_run=true); a release is made by pushing a v* tag"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the guard reads; nothing here pushes
      - name: the tagged commit has a green ci run
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: python3 tests/harness/verify_ci_green.py --repo "$GITHUB_REPOSITORY" --sha "$VERIFY_SHA"

  images:
    needs: verify-ci
    # Tag pushes only: a workflow_dispatch run stops after verify-ci.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        lang: [python, cpp, rust]
    env:
      IMAGE: ghcr.io/ashjha0/intraday-alpha-platform-${{ matrix.lang }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployment/docker/Dockerfile.${{ matrix.lang }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # v1.17 (F1): CycloneDX SBOM of the pushed image. syft's release tarball
      # is pinned by SHA-256 (the gitleaks/trivy pattern); it reads the
      # registry with the docker login above.
      - name: syft SBOM of the image (CycloneDX JSON)
        run: |
          curl -fsSL -o /tmp/syft.tar.gz \
            https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz
          echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  /tmp/syft.tar.gz" | sha256sum -c -
          tar -xzf /tmp/syft.tar.gz -C /tmp syft
          /tmp/syft "${IMAGE}@${{ steps.push.outputs.digest }}" \
            -o "cyclonedx-json=sbom-image-${{ matrix.lang }}.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "sbom-image-${{ matrix.lang }}.cdx.json"
      - name: attest the image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-image-${{ matrix.lang }}.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image-${{ matrix.lang }}
          path: sbom-image-${{ matrix.lang }}.cdx.json
          if-no-files-found: error
      - name: record the digest
        run: |
          mkdir -p digest
          printf '%s\n' "${{ steps.push.outputs.digest }}" > "digest/${{ matrix.lang }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.lang }}
          path: digest/${{ matrix.lang }}.txt
          if-no-files-found: error

  manifest:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write        # attest-sbom (the Python lock-file SBOMs)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # gh uses GH_TOKEN; nothing here pushes
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-image-*
          path: sboms
          merge-multiple: true
      # v1.17 (F1): CycloneDX SBOM of each hashed Python lock file (the pins
      # AND their sha256 hashes become component hashes).
      - name: cyclonedx-bom SBOMs of the Python lock files
        run: |
          python -m pip install cyclonedx-bom==7.5.0
          for lock in image ci; do
            # the lock file is POSITIONAL: -i is --index-url in cyclonedx-bom 7.x (the v1.17.0
            # manifest job failed on "-i <file>" and fell back to requirements.txt)
            cyclonedx-py requirements "python/requirements-$lock.txt" \
              --of JSON -o "sboms/sbom-python-requirements-$lock.cdx.json"
            jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
              "sboms/sbom-python-requirements-$lock.cdx.json"
          done
          ls -l sboms
      - name: attest the requirements-image SBOM (subject = the lock file)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: python/requirements-image.txt
          sbom-path: sboms/sbom-python-requirements-image.cdx.json
      - name: attest the requirements-ci SBOM (subject = the lock file)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: python/requirements-ci.txt
          sbom-path: sboms/sbom-python-requirements-ci.cdx.json
      - name: write release-manifest.json
        run: |
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg python "$(cat digests/python.txt)" \
            --arg cpp "$(cat digests/cpp.txt)" \
            --arg rust "$(cat digests/rust.txt)" \
            '{tag: $tag, commit: $commit, built_at: $built,
              images: ({python: $python, cpp: $cpp, rust: $rust}
                | to_entries
                | map({language: .key,
                       name: ("ghcr.io/ashjha0/intraday-alpha-platform-" + .key),
                       digest: .value,
                       reference: ("ghcr.io/ashjha0/intraday-alpha-platform-" + .key + ":" + $tag + "@" + .value)}))}' \
            > release-manifest.json
          cat release-manifest.json
          jq -e '.images | length == 3 and all(.digest | test("^sha256:[0-9a-f]{64}$"))' release-manifest.json
      - name: create the release if absent, attach the manifest and the SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-manifest.json sboms/*.cdx.json \
            --repo "$GITHUB_REPOSITORY" --clobber
