# =============================================================================
# risk-fuzz — the large differential-fuzz run of the hard-risk engines (Rust vs the Python oracle)
# (backlog epic E31; PLATFORM_CONVENTIONS.md §11.1 "How parity is tested").
#
# Every pull request already replays the committed corpus
# (tests/golden/risk_fuzz, ~3,800 steps) in Rust and Python (Java archived in v1.15). This job is
# the big one: it generates N FRESH step scripts from a fresh seed on the
# runner (python/tools/risk_fuzz.py; the Python engine is the oracle), runs
# the Rust engine over them through its own golden-test
# binary (IAP_RISK_FUZZ_DIR / IAP_RISK_FUZZ_OUT — no extra binary is
# built), and compares every decision, audit byte and final snapshot,
# including a snapshot -> restore -> continue check at random cut points.
#
# On a divergence the first diverging script is minimised by a delta-debugging
# shrinker and uploaded, with what each engine produced, as the
# `risk-fuzz-divergence` artifact; the job fails. A divergence is a real bug in
# one of the engines: reduce, decide from §11.1 which engine is right (Rust is
# normative), fix, and add the reduced case to the corpus or the edge golden.
#
# Triggers: nightly (seed = the run id, printed in the job summary so any run
# can be reproduced with `--seed`), manually, and from ci.yml's
# workflow_dispatch (risk_fuzz=true). It is NOT on the pull-request path.
# =============================================================================
name: risk-fuzz

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Master seed (integer); empty = this run's id"
        type: string
        default: ""
      count:
        description: "Number of fresh scripts (about 100 steps each)"
        type: string
        default: "400"
  workflow_call:
    inputs:
      seed:
        type: string
        default: ""
      count:
        type: string
        default: "400"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (toolchain pinned by input)
        with:
          toolchain: "1.99.0"      # == rust/rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Toolchain (the pinned Python requirements)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
      - name: Build the Rust engine driver (the golden_risk_fuzz test binary)
        working-directory: rust
        run: cargo test --locked -p risk --test golden_risk_fuzz --no-run
      - name: Differential fuzz (generate, run the Rust engine, diff, minimise)
        env:
          FUZZ_SEED: ${{ inputs.seed || github.run_id }}
          FUZZ_COUNT: ${{ inputs.count || '400' }}
        run: >
          python3 python/tools/risk_fuzz_nightly.py
          --seed "$FUZZ_SEED" --count "$FUZZ_COUNT"
          --work "$RUNNER_TEMP/risk_fuzz_work"
          --artifacts risk_fuzz_artifacts
      - name: Upload the minimised diverging script
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: risk-fuzz-divergence
          path: risk_fuzz_artifacts
          if-no-files-found: ignore
