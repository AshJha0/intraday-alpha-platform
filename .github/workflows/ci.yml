# =============================================================================
# CI — the gate every governance document already referred to.
#
# GOVERNANCE.md §1 requires "tests/harness/run_all.sh green (all four
# languages)" and "YAML must pass the structural validation used in CI";
# RUNBOOK_backtest.md says "CI treats budget breaks as failures";
# SECURITY.md routes deployment reports to CODEOWNERS. Until round 3 none of
# that existed.
# This workflow is it (PLATFORM_CONVENTIONS.md §9, §12.7).
#
# Jobs:
#   python | cpp | rust          one per language (python: a 3.11 + 3.12
#                                matrix running -m "not slow"), the canonical commands from
#                                docs/BUILD_NOTES.md, run in parallel; python
#                                (and golden) first restore or regenerate the
#                                seeded dataset so the data-dependent tests
#                                run instead of skipping
#   python-slow                  the files marked `slow` (pytest -m slow),
#                                in parallel with python, with --cov
#   integration                  tests/integration + tests/replay (tests/README.md
#                                levels 3-4: cross-component runs and same-seed
#                                byte determinism) — the `integration` and
#                                `replay` rows of run_all.sh's parity table
#   golden                       tests/harness/run_golden.sh — the promotion
#                                gate 10 artefact (every language's golden
#                                group; Java archived in v1.15, archive/java/)
#   deployment                   tests/harness/check_deployment.py: promtool
#                                check rules/config, promtool test rules, the
#                                Dockerfile/compose/k8s/ConfigMap/dashboard
#                                checks and the docker build-context proof
#   rust-pyo3                    maturin wheel of rust/features_py (pyo3),
#                                Rust-vs-Python native-feature parity tests
#                                and the events/s benchmark (job summary)
#   cpp-sanitizers               ASan+UBSan ctest (blocking; green on first run)
#   advisory                     ruff (blocking), gitleaks (blocking);
#                                clippy is a blocking step of the rust job;
#                                lychee link check (ADVISORY step, v1.17 F1)
#   supply-chain                 v1.14 (G-P1-7), all BLOCKING: pip-audit of
#                                both pinned requirement files, cargo audit
#                                and cargo deny (bans/licenses/sources) of the
#                                rust workspace and rust/features_py, trivy
#                                (lockfile vulns + Dockerfile/k8s misconfig).
#                                Ignores only via .github/audit-ignores.json
#                                (reason + expiry, tools/audit_ignores.py)
#   reproducible-build           v1.17 (F1): the wheel built twice with
#                                SOURCE_DATE_EPOCH (sha256 must match) and
#                                the python image built twice (report-only)
#   images                       builds the three images (python, cpp, rust;
#                                the java image was retired in v1.17, F9);
#                                needs every other job;
#                                runs on push to main and on PRs that change
#                                image inputs
#   regenerate                   manual only (workflow_dispatch with
#                                regenerate=true): runs
#                                tools/regenerate_dataset_artifacts.py — the
#                                dataset and every committed artefact derived
#                                from it — and uploads the changed files, so
#                                the artefacts are produced in the environment
#                                that verifies them
#   docs                         v1.17 (E4), advisory until added to the
#                                ruleset: tests/harness/check_docs.py (links,
#                                diagram index, API names, status freshness)
#                                plus lychee on external links
#   risk-fuzz                    manual only (workflow_dispatch with
#                                risk_fuzz=true): the large differential-fuzz
#                                run of the Rust and Python risk engines
#                                on freshly generated step scripts
#                                (.github/workflows/risk-fuzz.yml, which also
#                                runs nightly). The PR path replays the
#                                committed corpus instead (golden group) and
#                                the python job fails on a stale corpus
#
# Local equivalent of the whole thing:  bash tests/harness/run_all.sh
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Also run the dataset-artefact regeneration and upload the changed files"
        type: boolean
        default: false
      regenerate_only:
        description: "With regenerate: comma-separated steps of tools/regenerate_dataset_artifacts.py to run (empty = the whole chain; the dataset and features are always built first)"
        type: string
        default: ""
      regenerate_allow_rerun:
        description: "With regenerate: pass --allow-rerun (the report pipelines re-run on a synthetic data_version the ledger has seen, e.g. after a feature-engine semantics change; their entries are recorded as reruns)"
        type: boolean
        default: false
      risk_fuzz:
        description: "Also run the large risk differential-fuzz job (fresh scripts, three engines)"
        type: boolean
        default: false
      risk_fuzz_seed:
        description: "risk-fuzz master seed (integer); empty = the run id"
        type: string
        default: ""
      risk_fuzz_count:
        description: "risk-fuzz number of fresh scripts"
        type: string
        default: "400"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    # The 3.11 entry keeps the context name `python` (a required check of the
    # protect-main ruleset); the 3.12 entry reports as `python-312` (not required).
    name: ${{ matrix.python-version == '3.11' && 'python' || 'python-312' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = the pinned CI interpreter; 3.12 = what the studies run on (E-P1-6)
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the research stack
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
      # The seeded dataset (data/normalized + data/features, git-ignored) is
      # what test_research_runner::test_eq03_report_reproduces_through_the_runner,
      # test_alpha_golden::test_golden_fx05_via_class_on_bundled_data and the
      # test_alpha_interface frames run on; without it they skip and the
      # "runner reproduces the flagship report" claim is not CI-proven.  The
      # cache key is the generator inputs + the generator / normaliser /
      # feature-engine sources, so a change to any of them regenerates
      # (~10 s market data + ~60 s features; identical seed => identical bytes).
      - name: Restore the seeded dataset
        id: dataset-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw
            data/normalized
            data/features
          key: dataset-${{ runner.os }}-${{ hashFiles('configs/marketdata/generator.json', 'configs/instruments/instruments.json', 'configs/venues/venues.json', 'data/reference/feature_registry.json', 'python/src/iap/marketdata/**', 'python/src/iap/features/**', 'python/src/iap/core/**', 'python/src/iap/orderbook/**') }}
      - name: Generate the seeded dataset (cache miss)
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        working-directory: python
        env:
          PYTHONPATH: src
        run: |
          python3 -m iap.marketdata
          python3 -m iap.features
      - name: The data-dependent tests must run, not skip
        working-directory: python
        env:
          PYTHONPATH: src
        run: |
          test -f ../data/features/features_1.parquet
          python -m pytest -q -rs tests/test_research_runner.py -k eq03_report_reproduces \
            | tee /tmp/eq03.txt
          if grep -q "skipped" /tmp/eq03.txt; then
            echo "::error::test_eq03_report_reproduces_through_the_runner skipped — the dataset is missing"
            exit 1
          fi
      # The risk differential-fuzz corpus (tests/golden/risk_fuzz) is written
      # by the Python engine. Regenerate it here (Linux, Python 3.11) and diff
      # it against the committed bytes: a corpus that is stale, or that depends
      # on the platform it was generated on, fails before the Rust
      # replay trusts it.
      - name: risk fuzz corpus is current (regenerate + diff)
        if: matrix.python-version == '3.11'
        run: python3 python/tools/make_risk_fuzz_corpus.py --check
      # xdist: every test writes under tmp_path / tmp_path_factory (a
      # per-worker basetemp) and only READS the repo's data/, configs/ and
      # research/; `--dist loadfile` keeps a file's tests on one worker so the
      # module-scoped fixtures that build the golden runs and frames are built
      # once, not once per worker. The seeded dataset is the cache step above,
      # shared read-only. Same tests, same outcomes as the serial run
      # (compared test by test on the PR that introduced this, #23). pytest-cov
      # combines the workers' data into one coverage-python.xml.
      # E-P2-7: the files marked `slow` run in the parallel python-slow job
      # (which also carries coverage), so this PR job stays short.
      - name: pytest (not slow)
        working-directory: python
        env:
          PYTHONPATH: src
        run: >
          python -m pytest -q -n auto --dist loadfile --durations=25
          -m "not slow"
      # v1.17 (F4 / F5): the Python MVP loop latency budget and the peak-RSS
      # guards on the committed real slice (benchmarks/slices/
      # itch50_20190130_AAPL). Serial, after pytest, on the pinned 3.11 only:
      # the budgets (benchmarks/latency_budget.json, memory_budget.json) are
      # measured CI figures times a margin, so the guards are coarse (an
      # algorithmic regression or a path holding the day in memory, not
      # drift); the tables go to the job summary and the JSON to artifacts.
      - name: MVP loop latency budget (real slice, coarse)
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: python/src
        run: |
          python3 tests/harness/check_mvp_latency_budget.py             --json "$RUNNER_TEMP/mvp_latency_ci.json"
      - name: peak RSS guard (ingest + features on the real slice)
        if: matrix.python-version == '3.11'
        run: |
          python3 tests/harness/check_slice_memory.py             --json "$RUNNER_TEMP/slice_memory_ci.json"
      # v1.17 (F7): the C++ parity goldens regenerated by THIS runner's
      # Python (python/tests/test_f7_golden.py pins the committed bytes; the
      # artifact is the Linux bytes to commit when a platform libm differs
      # from the generating machine's).
      - name: regenerate the F7 parity goldens (artifact)
        if: always() && matrix.python-version == '3.11'
        working-directory: python
        run: |
          PYTHONPATH=src python3 tools/make_golden_f7.py --out "$RUNNER_TEMP/f7-goldens"
          PYTHONPATH=src python3 tools/make_golden_f7.py --check || true
      - name: upload the regenerated F7 goldens
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f7-goldens-linux
          path: ${{ runner.temp }}/f7-goldens
          if-no-files-found: ignore
      - name: upload slice guard output
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slice-guards
          path: |
            ${{ runner.temp }}/mvp_latency_ci.json
            ${{ runner.temp }}/slice_memory_ci.json
          if-no-files-found: ignore
      # E-P1-5: mypy on core/orderbook/execution/backtest/features and, since
      # v1.17 (F3), agents/llm/mvp/paper (config: python/pyproject.toml
      # [tool.mypy]); the error count goes to the job summary.  BLOCKING since
      # v1.16 (item 16): the count reached 0 (and is 0 on the F3 scope too).
      - name: mypy
        if: matrix.python-version == '3.12'
        working-directory: python
        run: |
          python -m pip install mypy==2.3.1
          set +e
          python -m mypy > /tmp/mypy.txt 2>&1
          rc=$?
          tail -n 1 /tmp/mypy.txt
          n=$(grep -c ": error:" /tmp/mypy.txt)
          {
            echo "### mypy"
            echo ""
            echo "errors: **$n** -- $(tail -n 1 /tmp/mypy.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  python-slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the research stack
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
      # The seeded dataset (data/normalized + data/features, git-ignored) is
      # what test_research_runner::test_eq03_report_reproduces_through_the_runner,
      # test_alpha_golden::test_golden_fx05_via_class_on_bundled_data and the
      # test_alpha_interface frames run on; without it they skip and the
      # "runner reproduces the flagship report" claim is not CI-proven.  The
      # cache key is the generator inputs + the generator / normaliser /
      # feature-engine sources, so a change to any of them regenerates
      # (~10 s market data + ~60 s features; identical seed => identical bytes).
      - name: Restore the seeded dataset
        id: dataset-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw
            data/normalized
            data/features
          key: dataset-${{ runner.os }}-${{ hashFiles('configs/marketdata/generator.json', 'configs/instruments/instruments.json', 'configs/venues/venues.json', 'data/reference/feature_registry.json', 'python/src/iap/marketdata/**', 'python/src/iap/features/**', 'python/src/iap/core/**', 'python/src/iap/orderbook/**') }}
      - name: Generate the seeded dataset (cache miss)
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        working-directory: python
        env:
          PYTHONPATH: src
        run: |
          python3 -m iap.marketdata
          python3 -m iap.features
      # xdist: every test writes under tmp_path / tmp_path_factory (a
      # per-worker basetemp) and only READS the repo's data/, configs/ and
      # research/; `--dist loadfile` keeps a file's tests on one worker so the
      # module-scoped fixtures that build the golden runs and frames are built
      # once, not once per worker. The seeded dataset is the cache step above,
      # shared read-only. Same tests, same outcomes as the serial run
      # (compared test by test on the PR that introduced this, #23). pytest-cov
      # combines the workers' data into one coverage-python.xml.
      # E-P2-7: the files marked `slow` (python/tests, pytestmark), with
      # coverage; runs in parallel with the python job.  The coverage
      # report therefore covers the slow files' tests.
      # v1.17 (F1): coverage floor. --cov-fail-under=55 is the figure this
      # job measured on the wave-2 integration PR #183 on 2026-10-15 (ci run
      # 38794738398: TOTAL 39638 statements, 17482 missed, 55.90%), rounded
      # down to the whole percent.  (58% was the pre-integration figure on
      # main at 6814b2d; the B2/B3, D2/D3 and E2-E5 modules are covered by
      # the fast `python` job, which this slow run does not count.)  Raise it
      # when coverage rises; never lower it without a CHANGELOG line.
      # 2026-10-15 (A5, PR #189): lowered to 54 — main at 4eea5d5 (after the
      # wave-3 merges #185/#186) already measured 54.76% in this job (run
      # 38805345163), i.e. under the 55 floor before this PR; the A5 PR
      # measured 54.47%.  CHANGELOG (Unreleased) records the change.
      - name: pytest (slow)
        working-directory: python
        env:
          PYTHONPATH: src
        run: >
          python -m pytest -q -n auto --dist loadfile --durations=25 -m slow
          --cov=iap --cov-report=term-missing
          --cov-report=xml:../coverage-python.xml
          --cov-fail-under=54
      - name: upload python coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage-python.xml
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the research stack
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
      # Run from the repo root: tests/conftest.py puts python/src on sys.path.
      - name: integration (cross-component end-to-end runs)
        run: python3 -m pytest -q tests/integration
      - name: replay (same seed => identical bytes)
        run: python3 -m pytest -q tests/replay

  cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make libgtest-dev libeigen3-dev
      - name: build
        working-directory: cpp
        run: bash build.sh
      - name: ctest
        working-directory: cpp
        run: ctest --test-dir build --output-on-failure
      # Coarse latency guard: run the Release bench_all (about 20 s) and fail
      # only when a hot row is more than 5x slower than the committed table
      # (benchmarks/results_cpp.md). A shared runner is not the 2-CPU Xeon the
      # table was measured on, so this catches algorithmic regressions, not
      # few-percent drift; see the header of the script. The table of ratios
      # goes to the job summary and the raw output is uploaded.
      - name: benchmark regression guard (coarse)
        run: |
          cpp/build/bench_all "$RUNNER_TEMP/bench_ci.md" > /dev/null
          python3 tests/harness/check_bench_regression.py \
            --current "$RUNNER_TEMP/bench_ci.md" --factor 5
      - name: upload bench_all output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-cpp
          path: ${{ runner.temp }}/bench_ci.md
          if-no-files-found: ignore
      # v1.12 (X6): per-event tick-to-trade percentiles (decode -> book ->
      # features -> alpha -> order decision; about 5 s). The full table goes to
      # the job summary and an artifact. The guard compares only the p50/p99
      # end-to-end rows with benchmarks/results_tick_to_trade.md (a CI-runner
      # baseline) at factor 8: shared-runner percentiles move with neighbour
      # load, so the guard catches algorithmic regressions only, never p99.9
      # or max (see benchmarks/RESULTS.md).
      - name: tick-to-trade benchmark (percentiles) + coarse guard
        run: |
          cpp/build/bench_tick_to_trade "$RUNNER_TEMP/tick_to_trade_ci.md" > /dev/null
          cat "$RUNNER_TEMP/tick_to_trade_ci.md" >> "$GITHUB_STEP_SUMMARY"
          python3 tests/harness/check_bench_regression.py \
            --current "$RUNNER_TEMP/tick_to_trade_ci.md" \
            --baseline benchmarks/results_tick_to_trade.md \
            --rows '^t2t .* p(50|99)$' --factor 8 \
            --title "C++ tick-to-trade guard (p50/p99, coarse)"
      - name: upload tick-to-trade output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-tick-to-trade
          path: ${{ runner.temp }}/tick_to_trade_ci.md
          if-no-files-found: ignore
      # v1.17 (F7): per-event latency of the ported execution rules on the
      # golden stream and the real slice (about 10 s). Report-only: the rows
      # are copied into benchmarks/results_exec_rules.md by hand; no guard.
      - name: execution-rule benchmark (F7 ports, percentiles)
        run: |
          cpp/build/bench_exec_rules "$RUNNER_TEMP/exec_rules_ci.md" > /dev/null
          cat "$RUNNER_TEMP/exec_rules_ci.md" >> "$GITHUB_STEP_SUMMARY"
      - name: upload execution-rule benchmark output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-exec-rules
          path: ${{ runner.temp }}/exec_rules_ci.md
          if-no-files-found: ignore
      # Coverage: rebuild with --coverage (gcov instrumentation) in a
      # separate build dir so the timed Release build above is unaffected,
      # then summarize with lcov. Report-only — no threshold enforced (no
      # existing baseline), uploaded as a CI artifact.
      - name: coverage build (gcov)
        working-directory: cpp
        run: |
          sudo apt-get install -y --no-install-recommends lcov
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build-cov -j2
          ctest --test-dir build-cov --output-on-failure
      - name: lcov summary
        working-directory: cpp
        run: |
          lcov --capture --directory build-cov --output-file ../coverage-cpp.info \
            --ignore-errors mismatch,gcov,negative --rc branch_coverage=0 || true
          lcov --remove ../coverage-cpp.info '/usr/*' '*/tests/*' \
            --output-file ../coverage-cpp.info --ignore-errors unused || true
          lcov --list ../coverage-cpp.info || true
      - name: upload cpp coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cpp
          path: coverage-cpp.info
          if-no-files-found: ignore

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (toolchain pinned by input)
        with:
          toolchain: "1.99.0"      # == rust/rust-toolchain.toml (check_deployment.py enforces)
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: cargo test (workspace)
        working-directory: rust
        run: cargo test --workspace --locked
      # v1.16 item 13: benches (risk check_order) must keep compiling.
      - name: cargo bench --no-run (workspace)
        working-directory: rust
        run: cargo bench --workspace --locked --no-run
      # BLOCKING: the workspace is clippy-clean; any new finding fails the job.
      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Coverage for the risk crate at minimum (the normative risk engine,
      # PLATFORM_CONVENTIONS.md §11.1). Report-only, uploaded as an artifact;
      # no threshold gate (no existing baseline).
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      - name: rust/risk coverage (cargo-llvm-cov)
        working-directory: rust
        run: |
          cargo llvm-cov --locked -p risk --summary-only --cobertura --output-path ../coverage-rust-risk.xml
      - name: upload rust risk coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust-risk
          path: coverage-rust-risk.xml
          if-no-files-found: ignore

  # v1.11 E2: the native feature engine exposed to Python through pyo3
  # (rust/features_py, a standalone package outside the workspace). Builds
  # the abi3 wheel with maturin, installs it next to the research stack,
  # runs the Rust-vs-Python parity tests on the golden vectors (they skip
  # elsewhere, so they must RUN here) and writes the events/s benchmark to
  # the job summary. Additive: no other job depends on it.
  rust-pyo3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (toolchain pinned by input)
        with:
          toolchain: "1.99.0"      # == rust/rust-toolchain.toml (check_deployment.py enforces)
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust/features_py
      - name: Install the research stack + maturin
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
          pip install maturin==1.7.8
      - name: cargo clippy (features_py, blocking)
        working-directory: rust/features_py
        run: cargo clippy --all-targets -- -D warnings
      - name: build + install the wheel (maturin)
        run: |
          maturin build --release -m rust/features_py/Cargo.toml -o dist
          pip install dist/iap_features_rs-*.whl
          python -c "import iap_features_rs as m; print(len(m.feature_names()), 'native slots')"
      - name: parity tests (must run, not skip)
        working-directory: python
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q -rs tests/test_features_rust_backend.py | tee /tmp/pyo3.txt
          if grep -q "skipped" /tmp/pyo3.txt; then
            echo "::error::Rust backend parity tests skipped — the extension did not import"
            exit 1
          fi
      - name: speed benchmark (events/s, python vs rust) -> job summary
        working-directory: python
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: |
          python tools/bench_native_features.py --repeat 3 --summary "$GITHUB_STEP_SUMMARY"
          python3 -m iap.marketdata > /dev/null
          f=$(ls ../data/normalized/*.normalized.iap1 | head -n 1)
          python tools/bench_native_features.py "$f" --max-events 200000 --cadence-ms 100             --repeat 1 --summary "$GITHUB_STEP_SUMMARY"

  # Memory/UB sanitizers over the full C++ ctest suite, in a separate build
  # dir so the timed Release build and the coverage build are unaffected.
  # Blocking: it passed on the first CI run (285 of 285 tests, no sanitizer
  # report), so a new ASan/UBSan finding now fails the workflow.
  cpp-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make libgtest-dev libeigen3-dev
      - name: build (ASan + UBSan)
        working-directory: cpp
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j2
      - name: ctest under sanitizers
        working-directory: cpp
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  # Lint and secrets signals (both blocking since v1.13). The dependency
  # audits moved to the blocking `supply-chain` job in v1.14 (G-P1-7).
  advisory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the whole history
      # G-P1-7: secrets scan.  The release tarball is pinned by SHA-256 (same
      # pattern as promtool in the deployment job), not fetched by tag alone.
      - name: gitleaks (blocking)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner -v .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: ruff check + format (blocking)
        run: |
          python -m pip install ruff==0.16.10
          ruff check python tests tools research deployment --output-format=concise
          ruff format --check python tests tools research deployment
      # v1.17 (F1): link check over every tracked Markdown file and the docs
      # HTML. ADVISORY: `continue-on-error`, so a dead or rate-limited link
      # annotates the run and never fails this (required) job. The config
      # (lychee.toml) excludes the GitHub API, localhost/loopback and private
      # hosts; the token raises the github.com rate limit.
      - name: lychee link check (advisory)
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress './**/*.md' 'docs/*.html'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          failIfEmpty: false

  # v1.14 (G-P1-7): BLOCKING dependency and configuration audits. A finding
  # fails the job; the only way past one is a bumped dependency or a reviewed,
  # time-boxed entry in .github/audit-ignores.json (tools/audit_ignores.py
  # fails the job once an entry's `expires` date has passed).
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: audit ignores are well-formed and unexpired
        run: python tools/audit_ignores.py --check
      - name: pip-audit (requirements-ci.txt, requirements-image.txt)
        run: |
          python -m pip install pip-audit==2.10.1
          IGNORES=$(python tools/audit_ignores.py --tool pip-audit)
          for req in python/requirements-ci.txt python/requirements-image.txt; do
            echo "::group::pip-audit $req"
            # shellcheck disable=SC2086  # IGNORES is a word list by design
            pip-audit -r "$req" --no-deps --disable-pip --strict $IGNORES
            echo "::endgroup::"
          done
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (toolchain pinned by input)
        with:
          toolchain: "1.99.0"      # == rust/rust-toolchain.toml (check_deployment.py enforces)
      - name: install cargo-audit + cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.19.9
      - name: lockfile for rust/features_py (standalone package, not committed)
        working-directory: rust/features_py
        run: cargo generate-lockfile
      - name: cargo audit (rust/Cargo.lock, rust/features_py)
        working-directory: rust
        run: |
          IGNORES=$(python ../tools/audit_ignores.py --tool cargo-audit)
          # shellcheck disable=SC2086
          cargo audit --deny warnings $IGNORES
          # shellcheck disable=SC2086
          cargo audit --deny warnings --file features_py/Cargo.lock $IGNORES
      - name: cargo deny (bans, licenses, sources)
        working-directory: rust
        run: |
          cargo deny --locked check bans licenses sources
          cargo deny --manifest-path features_py/Cargo.toml \
            check --config deny.toml bans licenses sources
      # trivy: release tarball pinned by SHA-256 (same pattern as gitleaks),
      # not the trivy-action (its tags were hijacked in March 2026).
      - name: install trivy
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          python tools/audit_ignores.py --tool trivy > /tmp/.trivyignore
      - name: trivy fs (lockfile vulnerabilities, HIGH/CRITICAL)
        run: |
          /tmp/trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /tmp/.trivyignore --skip-dirs data --skip-dirs research .
      - name: trivy config (Dockerfiles, compose, k8s; HIGH/CRITICAL)
        run: |
          /tmp/trivy config --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /tmp/.trivyignore deployment

  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1 (toolchain pinned by input)
        with:
          toolchain: "1.99.0"      # == rust/rust-toolchain.toml (check_deployment.py enforces)
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make libgtest-dev libeigen3-dev
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
      # Same seeded dataset as the python job (same cache key): the Python
      # golden group includes test_golden_fx05_via_class_on_bundled_data.
      - name: Restore the seeded dataset
        id: dataset-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw
            data/normalized
            data/features
          key: dataset-${{ runner.os }}-${{ hashFiles('configs/marketdata/generator.json', 'configs/instruments/instruments.json', 'configs/venues/venues.json', 'data/reference/feature_registry.json', 'python/src/iap/marketdata/**', 'python/src/iap/features/**', 'python/src/iap/core/**', 'python/src/iap/orderbook/**') }}
      - name: Generate the seeded dataset (cache miss)
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        working-directory: python
        env:
          PYTHONPATH: src
        run: |
          python3 -m iap.marketdata
          python3 -m iap.features
      - name: cross-language golden suite (promotion gate 10)
        run: bash tests/harness/run_golden.sh

  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # check_docker_build.py materialises the tracked tree
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Tooling
        run: |
          # check_headline_numbers.py imports iap.contracts / iap.lifecycle from
          # python/src to re-derive the contract counts: it needs the same
          # research stack as the python job (jsonschema/referencing/numpy).
          pip install --require-hashes -r python/requirements-ci.txt
          curl -fsSL -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
          echo "d9900a11e3c89261e6416e3c9989858bad7b206af8b6838dfe9a5392d8ddc60d  /tmp/prometheus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 /tmp/prometheus-2.53.0.linux-amd64/promtool /usr/local/bin/promtool
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
      - name: structural validation of deployment/
        run: python3 tests/harness/check_deployment.py --verbose
      # docs/POLYGLOT.md (plan E3): a FROZEN language copy may change only with
      # a `POLYGLOT-OVERRIDE: <reason>` line in a commit message or the PR
      # body, and may not grow new functions/types without `... new-api ...`.
      # Blocking on pull requests; advisory on push (a squash commit may not
      # carry the PR body). The body goes through env, never inline.
      - name: polyglot policy (frozen copies)
        env:
          POLYGLOT_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 tests/harness/check_polyglot_policy.py --self-test
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 tests/harness/check_polyglot_policy.py --base "origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            python3 tests/harness/check_polyglot_policy.py --base "$BEFORE_SHA" --advisory
          fi
      - name: headline numbers vs artefacts
        # exit 2 = only the research-ledger rows are stale (they move on every
        # research rerun); exit 1 = a platform number is wrong.
        run: |
          set +e
          python3 tests/harness/check_headline_numbers.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" = "2" ]; then
            echo "::warning::research-ledger numbers are stale — regenerate the research reports and the doc rows together"
          fi

  # v1.13 (G-P1-1, G-P1-2): research-state governance. The blackboard chain,
  # its git anchors and signatures verify; every agent with signed entries has
  # a registered public key; and the ledgers and the board only grow against
  # the base (no lost looks, no rewritten board history). Meant to be a
  # REQUIRED check (docs/governance/GOVERNANCE.md section 0).
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # verify-board / anchors and the monotone check read history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the research stack
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
      # v1.14 (G-P1-4): anchors, trust roots and the board are checked
      # against origin/main, which this change cannot rewrite. v1.15 (G-P1-2):
      # trust roots are enabled; an unsigned registry fails
      # (docs/governance/TRUST_ROOTS.md).
      - name: verify-board (chain, git prefixes, anchors, signatures)
        env:
          PYTHONPATH: python/src
        run: python -m iap.agents.cli verify-board --trust-ref origin/main
      # v1.16 (item 12): non-blocking warning when a PR changes code that an
      # OPEN pre-registration fingerprints (the registered run would be refused).
      - name: open pre-registrations' fingerprinted code unchanged (warning only)
        run: python tools/prereg_touch_check.py
      - name: agent public-key registry covers every signed writer, maintainer-signed
        run: python tests/harness/check_agent_keys.py --trust-ref origin/main --require-signed
      # v1.15 (G-P0-1): every promoted model's content hash matches its artefact.
      - name: model registry promotions carry a matching content hash
        env:
          PYTHONPATH: python/src
        run: python -m iap.mlops --registry research/models/registry check-promotions
      - name: ledgers and blackboard are monotone vs the base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python tests/harness/check_ledger_monotone.py --base "origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            python tests/harness/check_ledger_monotone.py --base "$BEFORE_SHA"
          else
            python tests/harness/check_ledger_monotone.py --base origin/main
          fi

  # Manual: regenerate every committed artefact that derives from the seeded
  # dataset (tools/regenerate_dataset_artifacts.py has the chain and its
  # order) and upload the files that changed. Nothing is committed from here:
  # the maintainer downloads the artifact (`gh run download`), reviews the
  # diff and commits it (CONTRIBUTING.md §4). It exists because the last
  # digits of the float artefacts depend on the platform and library
  # versions, and the suites above compare some of them exactly — so they are
  # generated where they are checked: this runner, Python 3.11, the pinned
  # requirements, plus the `ml` extra (python/pyproject.toml) at pinned
  # versions for the gated tree models of research/ml_reports.
  # v1.15 (A-P1-3): the agent eval harness - a fixed task set run with a
  # stub model (no network, no key, no spend), scored deterministically and
  # compared with research/agents/eval_baseline.json.  A score drop or a check
  # that passed in the baseline and fails now fails the job.  BLOCKING since
  # v1.16 (item 16): deterministic, green on every main run before the switch.
  agent-evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the research stack
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
      - name: agent eval harness vs baseline
        env:
          PYTHONPATH: python/src
          PYTHONUTF8: "1"
        run: |
          set -o pipefail
          python -m iap.agents.eval_harness --check --out /tmp/agent-evals.json | tee /tmp/agent-evals.txt
      - name: summary
        if: always()
        run: |
          echo "### agent eval harness" >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 /tmp/agent-evals.txt >> "$GITHUB_STEP_SUMMARY" || true

  # v1.17 (E4): documentation checks, tests/harness/check_docs.py - relative
  # links resolve, every docs/diagrams/*.mmd is embedded and DIAGRAMS.md is
  # numbered consecutively, every `iap.*` name in API_*.md resolves by import,
  # and "in progress" / "pending PR" / "not yet released" phrases older than
  # the last release tag are reported as STALE (exit 2: reported in the job
  # summary, not failing; the G5 truth pass cleared them for v1.17.0; a
  # structural failure, exit 1, fails the job).  lychee checks external links
  # as an advisory step.  ADVISORY until the owner adds `docs` to the
  # protect-main ruleset (docs/governance/REPO_SETTINGS.md).
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # status freshness blames each flagged line against the last tag
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the research stack
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
      - name: docs checks (links, diagram index, API names, status freshness)
        env:
          PYTHONPATH: python/src
          PYTHONUTF8: "1"
        run: |
          set +e
          python tests/harness/check_docs.py | tee /tmp/check_docs.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### docs checks (exit $rc; 2 = stale status text only)"
            echo '```'
            tail -n 40 /tmp/check_docs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = "1" ]; then exit 1; fi
      # v1.17 G5: the release truth check. On a tagged commit, a release/*
      # branch or a docs/*-status-truth branch, every undated "in progress" /
      # "not released" / pending-PR phrase and every ledger count other than
      # research/experiments.json's fails (check_docs.py --release; the same
      # mode runs by itself when HEAD carries a tag).
      - name: release truth (tagged release, release and truth-pass branches)
        if: startsWith(github.head_ref, 'release/') || endsWith(github.head_ref, '-status-truth')
        env:
          PYTHONPATH: python/src
          PYTHONUTF8: "1"
        run: python tests/harness/check_docs.py --release
      # External links: lychee, pinned by SHA-256 like the other release
      # tarballs; advisory because the network and third-party sites are not
      # this repository's to keep up.
      - name: lychee external links (advisory)
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/lychee.tar.gz             https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  /tmp/lychee.tar.gz" | sha256sum -c -
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          /tmp/lychee-x86_64-unknown-linux-gnu/lychee --config lychee.toml --no-progress             'README.md' '*.md' 'docs/**/*.md' 'docs/index.html' | tee /tmp/lychee.txt
          { echo "### lychee (advisory)"; echo '```'; tail -n 30 /tmp/lychee.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  regenerate:
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the research stack (+ the ml extra, pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-ci.txt
          pip install xgboost==3.2.0 lightgbm==4.7.0
      - name: regenerate (dataset -> features -> research -> goldens)
        env:
          REGENERATE_ONLY: ${{ inputs.regenerate_only }}
          REGENERATE_ALLOW_RERUN: ${{ inputs.regenerate_allow_rerun }}
        run: |
          RERUN=""
          if [ "$REGENERATE_ALLOW_RERUN" = "true" ]; then RERUN="--allow-rerun"; fi
          if [ -z "$REGENERATE_ONLY" ]; then
            python3 tools/regenerate_dataset_artifacts.py $RERUN --timings-out regeneration_timings.json
          else
            # A subset still needs the (git-ignored) dataset and features.
            python3 tools/regenerate_dataset_artifacts.py $RERUN \
              --only "dataset,features,$REGENERATE_ONLY" \
              --timings-out regeneration_timings.json
          fi
      - name: collect what changed
        run: |
          git status --short | tee regeneration_status.txt
          git diff --stat | tail -n 1
          python3 - <<'PY'
          import hashlib, json, pathlib
          norm = pathlib.Path("data/normalized")
          out = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in sorted(list(pathlib.Path("data/raw").glob("*.jsonl")) + list(norm.glob("*.iap1")))}
          pathlib.Path("regeneration_dataset_sha256.json").write_text(json.dumps(out, indent=2) + "\n")
          PY
          cp data/normalized/qc_report.json regeneration_qc_report.json
          # absent when a partial run (regenerate_only) skipped the features step
          if [ -f data/features/features_summary.json ]; then
            cp data/features/features_summary.json regeneration_features_summary.json
          fi
          # A regenerated step may also REMOVE a file (a baseline of an alpha
          # that left the adaptive subset): list those, do not tar them.
          git ls-files --deleted | tee regeneration_deleted.txt
          git ls-files --modified --others --exclude-standard \
            | { grep -vxFf regeneration_deleted.txt || true; } > regeneration_files.txt
          tar -czf regenerated.tar.gz --files-from=regeneration_files.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-artefacts
          path: regenerated.tar.gz
          if-no-files-found: error

  # The large differential-fuzz run of the three risk engines on fresh
  # scripts (see risk-fuzz.yml). Manual here, nightly there; never on the PR
  # path, which replays the committed corpus in the language jobs instead.
  risk-fuzz:
    if: github.event_name == 'workflow_dispatch' && inputs.risk_fuzz
    uses: ./.github/workflows/risk-fuzz.yml
    with:
      seed: ${{ inputs.risk_fuzz_seed }}
      count: ${{ inputs.risk_fuzz_count }}

  # v1.17 (F1): the Python wheel and the python image are each built TWICE
  # with SOURCE_DATE_EPOCH pinned to the commit date, and compared.
  #   wheel  BLOCKING: the two wheels' sha256 must match. setuptools' bdist
  #          honours SOURCE_DATE_EPOCH for the zip entry timestamps, so the
  #          bytes are a function of the tree alone; the pinned setuptools
  #          comes from the hashed image lock (requirements-image.txt).
  #   image  REPORT-ONLY (a mismatch is a ::warning and a job-summary row,
  #          never a failure): the base image IS pinned by digest already
  #          (SECURITY.md section 1), BuildKit rewrites every layer file
  #          timestamp to SOURCE_DATE_EPOCH (rewrite-timestamp) and the
  #          provenance/SBOM attestation manifests (which carry wall-clock
  #          timestamps) are disabled; what can still differ is the content
  #          `pip install` writes inside a RUN layer (for example .pyc headers
  #          and other install-time state). docs/governance/REPRODUCIBILITY.md
  #          section 4 records which of the two matched on the first runs.
  # Not a required check until the owner adds it to the protect-main ruleset
  # (docs/governance/GOVERNANCE.md section 0).
  reproducible-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: SOURCE_DATE_EPOCH = the commit date
        run: |
          sde=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$sde" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$sde ($(date -u -d "@$sde" +%Y-%m-%dT%H:%M:%SZ))"
      - name: build the wheel twice (blocking compare)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r python/requirements-image.txt
          for i in 1 2; do
            rm -rf python/build python/src/iap.egg-info "dist$i"
            pip wheel --no-deps --no-build-isolation --no-cache-dir -w "dist$i" ./python
          done
          ls -l dist1 dist2
          w1=$(ls dist1/*.whl); w2=$(ls dist2/*.whl)
          s1=$(sha256sum "$w1" | cut -d' ' -f1); s2=$(sha256sum "$w2" | cut -d' ' -f1)
          {
            echo "### reproducible build (SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH)"
            echo ""
            echo "| artefact | build 1 | build 2 | result |"
            echo "|---|---|---|---|"
            if [ "$(basename "$w1")" = "$(basename "$w2")" ] && [ "$s1" = "$s2" ]; then
              echo "| wheel $(basename "$w1") | $s1 | $s2 | MATCH |"
            else
              echo "| wheel $(basename "$w1") / $(basename "$w2") | $s1 | $s2 | MISMATCH |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(basename "$w1")" != "$(basename "$w2")" ] || [ "$s1" != "$s2" ]; then
            echo "::error::the Python wheel is not reproducible: $s1 != $s2"
            unzip -l "$w1" > /tmp/l1.txt; unzip -l "$w2" > /tmp/l2.txt; diff /tmp/l1.txt /tmp/l2.txt || true
            exit 1
          fi
          echo "wheel: MATCH ($s1)"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the python image twice (report-only compare)
        run: |
          for i in 1 2; do
            docker buildx build --no-cache --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              -f deployment/docker/Dockerfile.python \
              --output "type=oci,dest=$RUNNER_TEMP/python-$i.tar,rewrite-timestamp=true" .
            tar -xOf "$RUNNER_TEMP/python-$i.tar" index.json \
              | jq -r '.manifests[0].digest' > "image-digest-$i.txt"
          done
          d1=$(cat image-digest-1.txt); d2=$(cat image-digest-2.txt)
          if [ "$d1" = "$d2" ]; then res=MATCH; else res="MISMATCH (report-only)"; fi
          echo "| python image (OCI manifest) | $d1 | $d2 | $res |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$d1" != "$d2" ]; then
            echo "::warning::the python image is not bit-reproducible ($d1 vs $d2); report-only, see the job summary"
            for i in 1 2; do
              m=$(cat "image-digest-$i.txt" | sed 's/^sha256://')
              echo "--- build $i layers"
              tar -xOf "$RUNNER_TEMP/python-$i.tar" "blobs/sha256/$m" | jq -r '.config.digest, (.layers[] | .digest + " " + (.size|tostring))'
            done
          fi
          echo "image: $res"

  # Which PRs touch image inputs: the image build runs on those, not on every PR.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - 'deployment/docker/**'
              - '**/Dockerfile*'
              - '.dockerignore'
              - 'python/requirements-ci.txt'
              - 'python/requirements-image.txt'
              - 'rust/rust-toolchain.toml'
              - 'rust/Cargo.lock'

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [python, python-slow, integration, cpp, rust, golden, deployment, changes]
    # Image builds are the merge-to-main promotion gate (GOVERNANCE gate 10).
    # They run on every push to main, and on a pull request only when it
    # changes image inputs (deployment/docker/**, any Dockerfile, the pinned
    # Python/Rust inputs): see the `changes` job. On other PRs this job is
    # skipped, so it must NOT be listed as a required status check (a skipped
    # required check blocks the merge); the required set is in
    # docs/governance/REPO_SETTINGS.md.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GOVERNANCE promotion gate 10: an image is only ever built from a tree
      # whose full suite and golden gate are green — hence `needs:` above.
      - name: build all three images
        run: |
          for df in python cpp rust; do
            docker build -f "deployment/docker/Dockerfile.$df" \
              -t "iap/$df:ci-${GITHUB_SHA::12}" .
          done
      # v1.14 (G-P1-7): every image is scanned, blocking on HIGH/CRITICAL
      # vulnerabilities that have a fix (ignores: .github/audit-ignores.json).
      - name: trivy image scan (HIGH/CRITICAL, fixable)
        run: |
          curl -fsSL -o /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          python3 tools/audit_ignores.py --tool trivy > /tmp/.trivyignore
          rc=0
          for df in python cpp rust; do   # scan all three, then fail
            /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --ignorefile /tmp/.trivyignore "iap/$df:ci-${GITHUB_SHA::12}" || rc=1
          done
          exit "$rc"
      - name: the C++ replay container runs bench_all to completion
        run: docker run --rm "iap/cpp:ci-${GITHUB_SHA::12}"
      - name: the Rust replay container exits 0
        run: docker run --rm "iap/rust:ci-${GITHUB_SHA::12}" /golden
      - name: compose config is valid
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
        run: docker compose -f deployment/docker/docker-compose.yml config -q
