# =============================================================================
# CI — the gate every governance document already referred to.
#
# GOVERNANCE.md §1 requires "tests/harness/run_all.sh green (all four
# languages)" and "YAML must pass the structural validation used in CI";
# RUNBOOK_backtest.md says "CI treats budget breaks as failures";
# SECURITY.md routes deployment reports to CODEOWNERS; Dockerfile.java defers
# its JUnit gate to "the CI harness". Until round 3 none of that existed.
# This workflow is it (PLATFORM_CONVENTIONS.md §9, §12.7).
#
# Jobs:
#   python | cpp | rust | java   one per language, the canonical commands from
#                                docs/BUILD_NOTES.md, run in parallel; python
#                                (and golden) first restore or regenerate the
#                                seeded dataset so the data-dependent tests
#                                run instead of skipping
#   integration                  tests/integration + tests/replay (tests/README.md
#                                levels 3-4: cross-component runs and same-seed
#                                byte determinism) — the `integration` and
#                                `replay` rows of run_all.sh's parity table
#   golden                       tests/harness/run_golden.sh — the promotion
#                                gate 10 artefact (every language's golden
#                                group, including ALL Java *GoldenTest classes)
#   deployment                   tests/harness/check_deployment.py: promtool
#                                check rules/config, promtool test rules, the
#                                Dockerfile/compose/k8s/ConfigMap/dashboard
#                                checks and the docker build-context proof
#   cpp-sanitizers               ASan+UBSan ctest (blocking; green on first run)
#   advisory                     ruff (blocking), pip-audit, cargo audit
#                                (non-blocking); clippy is a blocking step of
#                                the rust job
#   images                       builds the four images; needs every other job;
#                                runs on push to main and on PRs that change
#                                image inputs
#   regenerate                   manual only (workflow_dispatch with
#                                regenerate=true): runs
#                                tools/regenerate_dataset_artifacts.py — the
#                                dataset and every committed artefact derived
#                                from it — and uploads the changed files, so
#                                the artefacts are produced in the environment
#                                that verifies them
#
# Local equivalent of the whole thing:  bash tests/harness/run_all.sh
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Also run the dataset-artefact regeneration and upload the changed files"
        type: boolean
        default: false
      regenerate_only:
        description: "Comma-separated regeneration steps (--only); empty = the whole chain"
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the research stack
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements-ci.txt
      # The seeded dataset (data/normalized + data/features, git-ignored) is
      # what test_research_runner::test_eq03_report_reproduces_through_the_runner,
      # test_alpha_golden::test_golden_fx05_via_class_on_bundled_data and the
      # test_alpha_interface frames run on; without it they skip and the
      # "runner reproduces the flagship report" claim is not CI-proven.  The
      # cache key is the generator inputs + the generator / normaliser /
      # feature-engine sources, so a change to any of them regenerates
      # (~10 s market data + ~60 s features; identical seed => identical bytes).
      - name: Restore the seeded dataset
        id: dataset-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw
            data/normalized
            data/features
          key: dataset-${{ runner.os }}-${{ hashFiles('configs/marketdata/generator.json', 'configs/instruments/instruments.json', 'configs/venues/venues.json', 'data/reference/feature_registry.json', 'python/src/iap/marketdata/**', 'python/src/iap/features/**', 'python/src/iap/core/**', 'python/src/iap/orderbook/**') }}
      - name: Generate the seeded dataset (cache miss)
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        working-directory: python
        env:
          PYTHONPATH: src
        run: |
          python3 -m iap.marketdata
          python3 -m iap.features
      - name: The data-dependent tests must run, not skip
        working-directory: python
        env:
          PYTHONPATH: src
        run: |
          test -f ../data/features/features_1.parquet
          python -m pytest -q -rs tests/test_research_runner.py -k eq03_report_reproduces \
            | tee /tmp/eq03.txt
          if grep -q "skipped" /tmp/eq03.txt; then
            echo "::error::test_eq03_report_reproduces_through_the_runner skipped — the dataset is missing"
            exit 1
          fi
      - name: pytest
        working-directory: python
        env:
          PYTHONPATH: src
        run: >
          python -m pytest -q --cov=iap --cov-report=term-missing
          --cov-report=xml:../coverage-python.xml
      - name: upload python coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python
          path: coverage-python.xml
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the research stack
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements-ci.txt
      # Run from the repo root: tests/conftest.py puts python/src on sys.path.
      - name: integration (cross-component end-to-end runs)
        run: python3 -m pytest -q tests/integration
      - name: replay (same seed => identical bytes)
        run: python3 -m pytest -q tests/replay

  cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make libgtest-dev libeigen3-dev
      - name: build
        working-directory: cpp
        run: bash build.sh
      - name: ctest
        working-directory: cpp
        run: ctest --test-dir build --output-on-failure
      # Coverage: rebuild with --coverage (gcov instrumentation) in a
      # separate build dir so the timed Release build above is unaffected,
      # then summarize with lcov. Report-only — no threshold enforced (no
      # existing baseline), uploaded as a CI artifact.
      - name: coverage build (gcov)
        working-directory: cpp
        run: |
          sudo apt-get install -y --no-install-recommends lcov
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build-cov -j2
          ctest --test-dir build-cov --output-on-failure
      - name: lcov summary
        working-directory: cpp
        run: |
          lcov --capture --directory build-cov --output-file ../coverage-cpp.info \
            --ignore-errors mismatch,gcov,negative --rc branch_coverage=0 || true
          lcov --remove ../coverage-cpp.info '/usr/*' '*/tests/*' \
            --output-file ../coverage-cpp.info --ignore-errors unused || true
          lcov --list ../coverage-cpp.info || true
      - name: upload cpp coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cpp
          path: coverage-cpp.info
          if-no-files-found: ignore

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (toolchain pinned by input)
        with:
          toolchain: "1.98.1"      # == rust/rust-toolchain.toml (check_deployment.py enforces)
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: cargo test (workspace)
        working-directory: rust
        run: cargo test --workspace --locked
      # BLOCKING: the workspace is clippy-clean; any new finding fails the job.
      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Coverage for the risk crate at minimum (the normative risk engine,
      # PLATFORM_CONVENTIONS.md §11.1). Report-only, uploaded as an artifact;
      # no threshold gate (no existing baseline).
      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - name: rust/risk coverage (cargo-llvm-cov)
        working-directory: rust
        run: |
          cargo llvm-cov --locked -p risk --summary-only --cobertura --output-path ../coverage-rust-risk.xml
      - name: upload rust risk coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust-risk
          path: coverage-rust-risk.xml
          if-no-files-found: ignore

  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: JUnit4 + Hamcrest (local jars — no Maven, see BUILD_NOTES.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends junit4
          # java/test.sh pins both jars at /usr/share/java.
          test -f /usr/share/java/junit4.jar
          test -f /usr/share/java/hamcrest-core.jar
      - name: build + test (javac -Xlint:all -Werror, JUnit4 suite)
        working-directory: java
        run: bash test.sh
      # Coverage: no Maven/Gradle (Maven Central unreachable here, see
      # docs/BUILD_NOTES.md) and no JaCoCo jar vendored in java/lib/, so
      # instrumenting coverage would mean vendoring a new binary dependency
      # sight-unseen. Skipped deliberately rather than done unsafely; if
      # JaCoCo (agent + cli jars) is vendored and checksummed in java/lib/
      # in a future wave, wire `java -javaagent:jacocoagent.jar=...` into
      # test.sh here and drop this note.
      - name: java coverage (skipped — no JaCoCo vendored)
        run: |
          echo "::notice::Java coverage skipped: no Maven/Gradle and no JaCoCo jar vendored in java/lib/ (see docs/BUILD_NOTES.md)"

  # Memory/UB sanitizers over the full C++ ctest suite, in a separate build
  # dir so the timed Release build and the coverage build are unaffected.
  # Blocking: it passed on the first CI run (285 of 285 tests, no sanitizer
  # report), so a new ASan/UBSan finding now fails the workflow.
  cpp-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make libgtest-dev libeigen3-dev
      - name: build (ASan + UBSan)
        working-directory: cpp
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan -j2
      - name: ctest under sanitizers
        working-directory: cpp
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  # Non-blocking supply-chain and lint signals. Each step is continue-on-error
  # so a finding is reported in the log (and the step summary) without failing
  # the workflow; none of them is a required check.
  advisory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: ruff check + format (blocking)
        run: |
          python -m pip install ruff==0.16.10
          ruff check python tests tools research deployment --output-format=concise
          ruff format --check python tests tools research deployment
      - name: pip-audit (python/requirements-ci.txt)
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r python/requirements-ci.txt --no-deps --disable-pip
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (toolchain pinned by input)
        with:
          toolchain: "1.98.1"      # == rust/rust-toolchain.toml (check_deployment.py enforces)
      - name: install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      - name: cargo audit (rust/Cargo.lock)
        continue-on-error: true
        working-directory: rust
        run: cargo audit

  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (toolchain pinned by input)
        with:
          toolchain: "1.98.1"      # == rust/rust-toolchain.toml (check_deployment.py enforces)
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make libgtest-dev libeigen3-dev junit4
          python -m pip install --upgrade pip
          pip install -r python/requirements-ci.txt
      # Same seeded dataset as the python job (same cache key): the Python
      # golden group includes test_golden_fx05_via_class_on_bundled_data.
      - name: Restore the seeded dataset
        id: dataset-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/raw
            data/normalized
            data/features
          key: dataset-${{ runner.os }}-${{ hashFiles('configs/marketdata/generator.json', 'configs/instruments/instruments.json', 'configs/venues/venues.json', 'data/reference/feature_registry.json', 'python/src/iap/marketdata/**', 'python/src/iap/features/**', 'python/src/iap/core/**', 'python/src/iap/orderbook/**') }}
      - name: Generate the seeded dataset (cache miss)
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        working-directory: python
        env:
          PYTHONPATH: src
        run: |
          python3 -m iap.marketdata
          python3 -m iap.features
      - name: cross-language golden suite (promotion gate 10)
        run: bash tests/harness/run_golden.sh

  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # check_docker_build.py materialises the tracked tree
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Tooling
        run: |
          # check_headline_numbers.py imports iap.contracts / iap.lifecycle from
          # python/src to re-derive the contract counts: it needs the same
          # research stack as the python job (jsonschema/referencing/numpy).
          pip install -r python/requirements-ci.txt
          curl -fsSL -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
          echo "d9900a11e3c89261e6416e3c9989858bad7b206af8b6838dfe9a5392d8ddc60d  /tmp/prometheus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 /tmp/prometheus-2.53.0.linux-amd64/promtool /usr/local/bin/promtool
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
      - name: structural validation of deployment/
        run: python3 tests/harness/check_deployment.py --verbose
      - name: headline numbers vs artefacts
        # exit 2 = only the research-ledger rows are stale (they move on every
        # research rerun); exit 1 = a platform number is wrong.
        run: |
          set +e
          python3 tests/harness/check_headline_numbers.py
          rc=$?
          set -e
          if [ "$rc" = "1" ]; then exit 1; fi
          if [ "$rc" = "2" ]; then
            echo "::warning::research-ledger numbers are stale — regenerate the research reports and the doc rows together"
          fi

  # Manual: regenerate every committed artefact that derives from the seeded
  # dataset (tools/regenerate_dataset_artifacts.py has the chain and its
  # order) and upload the files that changed. Nothing is committed from here:
  # the maintainer downloads the artifact (`gh run download`), reviews the
  # diff and commits it (CONTRIBUTING.md §4). It exists because the last
  # digits of the float artefacts depend on the platform and library
  # versions, and the suites above compare some of them exactly — so they are
  # generated where they are checked: this runner, Python 3.11, the pinned
  # requirements, plus the `ml` extra (python/pyproject.toml) at pinned
  # versions for the gated tree models of research/ml_reports.
  regenerate:
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the research stack (+ the ml extra, pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements-ci.txt
          pip install xgboost==3.2.0 lightgbm==4.7.0
      - name: regenerate (dataset -> features -> research -> goldens)
        env:
          REGENERATE_ONLY: ${{ inputs.regenerate_only }}
        run: |
          if [ -n "$REGENERATE_ONLY" ]; then
            python3 tools/regenerate_dataset_artifacts.py --only "$REGENERATE_ONLY" \
              --timings-out regeneration_timings.json
          else
            python3 tools/regenerate_dataset_artifacts.py --timings-out regeneration_timings.json
          fi
      - name: collect what changed
        run: |
          git status --short | tee regeneration_status.txt
          git diff --stat | tail -n 1
          python3 - <<'PY'
          import hashlib, json, pathlib
          norm = pathlib.Path("data/normalized")
          out = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in sorted(list(pathlib.Path("data/raw").glob("*.jsonl")) + list(norm.glob("*.iap1")))}
          pathlib.Path("regeneration_dataset_sha256.json").write_text(json.dumps(out, indent=2) + "\n")
          PY
          cp data/normalized/qc_report.json regeneration_qc_report.json
          # absent when a partial run (regenerate_only) skipped the features step
          if [ -f data/features/features_summary.json ]; then
            cp data/features/features_summary.json regeneration_features_summary.json
          fi
          # A regenerated step may also REMOVE a file (a baseline of an alpha
          # that left the adaptive subset): list those, do not tar them.
          git ls-files --deleted | tee regeneration_deleted.txt
          git ls-files --modified --others --exclude-standard \
            | { grep -vxFf regeneration_deleted.txt || true; } > regeneration_files.txt
          tar -czf regenerated.tar.gz --files-from=regeneration_files.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-artefacts
          path: regenerated.tar.gz
          if-no-files-found: error

  # Which PRs touch image inputs: the image build runs on those, not on every PR.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - 'deployment/docker/**'
              - '**/Dockerfile*'
              - '.dockerignore'
              - 'python/requirements-ci.txt'
              - 'rust/rust-toolchain.toml'
              - 'rust/Cargo.lock'

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [python, integration, cpp, rust, java, golden, deployment, changes]
    # Image builds are the merge-to-main promotion gate (GOVERNANCE gate 10).
    # They run on every push to main, and on a pull request only when it
    # changes image inputs (deployment/docker/**, any Dockerfile, the pinned
    # Python/Rust inputs): see the `changes` job. On other PRs this job is
    # skipped, so it must NOT be listed as a required status check (a skipped
    # required check blocks the merge); the required set is in
    # docs/governance/REPO_SETTINGS.md.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GOVERNANCE promotion gate 10: an image is only ever built from a tree
      # whose full suite and golden gate are green — hence `needs:` above.
      - name: build all four images
        run: |
          for df in python java cpp rust; do
            docker build -f "deployment/docker/Dockerfile.$df" \
              -t "iap/$df:ci-${GITHUB_SHA::12}" .
          done
      - name: the C++ replay container runs bench_all to completion
        run: docker run --rm "iap/cpp:ci-${GITHUB_SHA::12}"
      - name: the Rust replay container exits 0
        run: docker run --rm "iap/rust:ci-${GITHUB_SHA::12}" /golden
      - name: compose config is valid
        env:
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
        run: docker compose -f deployment/docker/docker-compose.yml config -q
