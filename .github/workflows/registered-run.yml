# =============================================================================
# registered-run — the CR1 registered runner (v2.0 stage 2; U0 section 2).
#
# One registered analysis, run once, on sealed data, by a process the
# development identity does not control:
#
#   * trigger: workflow_dispatch ONLY (no push, no pull_request: a fork or a
#     branch cannot start it), naming the signed prereg and its bound commit;
#   * environment `sealed`: a protected environment whose required reviewer
#     is the owner's GitHub account, so every run waits for an explicit
#     approval (docs/governance/REPO_SETTINGS.md section 7);
#   * runner: the SELF-HOSTED runner registered with the labels below, whose
#     service runs as the local account `iap-runner` on the workstation
#     (docs/governance/RUNNER_SETUP.md). No cloud credentials, no secrets in
#     this file; the sealed service authenticates the caller through the
#     named pipe (OS identity, no token);
#   * the job checks out exactly the bound commit, verifies identity,
#     signature, freeze hashes, image digest and dataset hashes, requests
#     the sealed read, runs once, commits the result to the protected
#     `results` branch as iap-runner, publishes the checkpoint, and uploads
#     ONLY the redacted log (tools/runner/run.py);
#   * debug modes: ACTIONS_STEP_DEBUG / ACTIONS_RUNNER_DEBUG are forced off
#     here and must not be set as environment variables or secrets of
#     `sealed` (REPO_SETTINGS.md); the runner never prints data;
#   * mode `dd1` (v2.0 stage 2 DD1): the same approval, runner identity and
#     redacted-log rules, no prereg: tools/ingest/dd1_daily.py pulls the free
#     daily route and seals Track B and Track C through the services' ingest
#     endpoint (docs/governance/DD1_INGESTION_RUNBOOK.md). `prereg` is
#     ignored in that mode; TIINGO_API_KEY, if the owner set it in the
#     runner service's own environment, selects Tiingo over Stooq (never a
#     secret of this workflow).
#
# Changing this file or tools/runner/ needs the owner's review (CODEOWNERS +
# the branch ruleset's code-owner requirement). The evidence class of what
# this workflow produces is "mechanically isolated" while the owner holds
# development, administration and approval alone (property 6).
# =============================================================================
name: registered-run

on:
  workflow_dispatch:
    inputs:
      prereg:
        description: "Repository-relative path of the SIGNED prereg with a registered_run block"
        required: true
        type: string
      commit:
        description: "The bound commit (analysis_identity.commit); the job checks out exactly this"
        required: true
        type: string
      mode:
        description: "registered: one signed analysis on sealed data. dd1: the DD1 ingestion of the free daily route (no prereg)"
        required: false
        default: registered
        type: choice
        options:
          - registered
          - dd1
      year:
        description: "dd1 only: the purchase year Y that cuts the partitions (default: this year)"
        required: false
        default: ""
        type: string

permissions:
  contents: write # push one commit to the protected results branch; nothing else

concurrency:
  group: registered-run
  cancel-in-progress: false # a registration is one run; never cancel one mid-way

jobs:
  registered-run:
    name: registered run (sealed)
    runs-on: [self-hosted, windows, iap-runner]
    environment: sealed
    timeout-minutes: 480
    env:
      ACTIONS_STEP_DEBUG: "false"
      ACTIONS_RUNNER_DEBUG: "false"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Resolve the bound commit to its full SHA
        # actions/checkout treats a short SHA as a branch or tag name and fails
        # ("could not be found", observed 2026-10-25 run 40215808482); resolve through
        # the API so the owner may type either form. The identity check later
        # compares the checked-out HEAD with the prereg's bound commit anyway.
        id: resolve
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          BOUND: ${{ inputs.commit }}
        run: |
          if ($env:BOUND -notmatch '^[0-9a-fA-F]{7,40}$') { throw "commit must be a hex SHA (7 to 40 characters), got '$env:BOUND'" }
          # plain web request: the self-hosted runner has only Windows PowerShell 5.1 and need not have gh on its path
          try { $r = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/commits/$env:BOUND" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "User-Agent" = "iap-registered-run" } }
          catch { throw "commit '$env:BOUND' not found in this repository ($($_.Exception.Message))" }
          $sha = [string]$r.sha
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "unexpected API answer for '$env:BOUND'" }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          Write-Host "bound commit $env:BOUND -> $sha"

      - name: Check out the bound commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0 # the results branch and the trust root history are needed
          persist-credentials: true # the push to results/ uses the job token

      - name: The process is the runner identity
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python tools/runner/run.py whoami
          if ($LASTEXITCODE -ne 0) { throw "not running as iap-runner" }

      - name: Install the pinned research stack
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python -m pip install --upgrade pip
          # --no-deps: the lock is complete for Linux CI but omits tzdata, which pandas
          # needs on Windows (defect D-83); until the lock carries it, install the lock
          # without resolution and add tzdata pinned by version.
          pip install --require-hashes --no-deps -r python/requirements-ci.txt
          pip install --no-deps tzdata==2026.5

      - name: Registered run (verify, sealed read, run once, commit, publish)
        if: ${{ inputs.mode != 'dd1' }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python tools/runner/run.py run --prereg "${{ inputs.prereg }}" --push --log results-log.redacted.txt
          if ($LASTEXITCODE -ne 0) { throw "registered run exit $LASTEXITCODE (see the redacted log)" }

      - name: DD1 ingestion (pull, cut, test, seal Track B and C, record)
        if: ${{ inputs.mode == 'dd1' }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $year = if ("${{ inputs.year }}" -ne "") { "${{ inputs.year }}" } else { (Get-Date).Year }
          python tools/ingest/dd1_daily.py run --year $year --dev-root C:\iap\daily --log results-log.redacted.txt
          if ($LASTEXITCODE -ne 0) { throw "dd1 ingestion exit $LASTEXITCODE (see the redacted log)" }

      - name: Upload the redacted log (the only artifact)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registered-run-redacted-log
          path: results-log.redacted.txt
          if-no-files-found: ignore
          retention-days: 90
