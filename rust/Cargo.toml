[workspace]
resolver = "2"
members = [
    "marketdata",
    "orderbook",
    "replay",
    "eventbus",
    "telemetry",
    "features",
    "alpha",
    "risk",
    "venue",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep `cargo test` fast (< 90s budget): golden replay + threading tests are
# integer-heavy, so optimize even in the dev profile.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
