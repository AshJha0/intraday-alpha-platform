# gitleaks config (v1.13, G-P1-7): the default rules plus two reviewed
# false-positive allowlists.  Keep each entry narrow and explained.
title = "iap gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "ledger content keys are SHA-256 digests of the experiment spec, not credentials: research/experiments.json, its v1.18 inventory copy research/v118/LEDGER_INVENTORY.json and the v1.19 R3 family dependency map research/validation/LEDGER_FAMILY_MAP.json (tools/ledger_family_map.py; the field was briefly named key on the stage 1 branch, hence both names)"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"(key|ledger_entry_key)": "[0-9a-f]{64}",?\s*$''']
paths = ['''^research/experiments\.json$''', '''^research/v118/LEDGER_INVENTORY\.json$''', '''^research/validation/LEDGER_FAMILY_MAP\.json$''']

[[allowlists]]
description = "COOKBOOK demo of the local admin kill switch uses the documented placeholder bearer token dev-token"
condition = "AND"
regexTarget = "match"
regexes = ['''dev-token''']
paths = ['''^COOKBOOK\.md$''']
