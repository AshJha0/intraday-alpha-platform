# =============================================================================
# docker-compose.yml — Intraday Alpha Platform local production-shape stack
#
# Topology (spec §4/§25):
#   data-generator (python, batch)
#       -> shared volume /data (raw + normalized + qc_report.json)
#   cpp-replay, rust-replay (deterministic replay / exec sim)
#   mvp-session (python: the MVP loop over the golden instrument, finite,
#                writes /data/mvp/golden with the session marker maintained
#                by `python -m iap.metrics run-session`)
#   platform-metrics (python: `python -m iap.metrics serve` — GET /metrics,
#                /health, /ready, /status on :8080, read from the configs,
#                the session marker and the newest MVP run; v1.17 F9, it
#                replaces the retired Java platform image, DECISION_N7)
#   prometheus  -> scrapes platform-metrics (the only metrics producer) and
#                  sends alerts to alertmanager (webhook receiver; the
#                  always-firing Watchdog alert proves the path end to end)
#   alertmanager -> routes alerts to the webhook whose URL is a secret file
#   grafana     -> provisioned dashboards (deployment/grafana/)
#
# The rust-telemetry-exporter sidecar was REMOVED in round 3: no Rust binary
# ever wrote /data/telemetry/rust.prom, so it served an empty file and kept a
# permanently-down scrape target (see deployment/prometheus/prometheus.yml).
#
# Run from the repo root:   docker compose -f deployment/docker/docker-compose.yml up --build
#
# Image pinning: the iap images are built from this repo here (`build:`) and are
# named after the GHCR images .github/workflows/release.yml publishes
# (ghcr.io/ashjha0/intraday-alpha-platform-{python,cpp,rust}:<tag>); pulling
# instead of building uses the same names. The tag names the release that
# ships this file's services (v1.17.0: `iap.metrics` is not in an older
# python image), so until that tag is published `docker compose up --build`
# builds locally. `python tools/release.py publish` pins the KUBERNETES
# manifests by digest from release-manifest.json (<name>:<tag>@sha256:...);
# a compose service with `build:` cannot carry a digest (a built image
# cannot be tagged with one), so compose stays on the tag. Third-party
# images are pinned here by tag AND digest.
# =============================================================================

name: intraday-alpha-platform

volumes:
  iap-data: {}        # generated market data — never baked into images
  prom-data: {}
  grafana-data: {}
  alertmanager-data: {}

# Alert receiver URLs are SECRETS (they usually embed a token) and are never
# committed. Point ALERT_PAGE_URL_FILE / ALERT_TICKET_URL_FILE at files OUTSIDE
# the repo (docs/runbooks/RUNBOOK_alerting.md). Unset, both use the tracked,
# secret-free local-sink.url -> the `alert-sink` echo service below, so
# `docker compose up` works with no secrets and alerts can be watched arriving
# (`docker logs -f iap-alert-sink`). ALERT_WEBHOOK_URL_FILE (<= v1.11) is still
# honoured as the page URL.
secrets:
  alert_page_url:
    file: ${ALERT_PAGE_URL_FILE:-${ALERT_WEBHOOK_URL_FILE:-../alertmanager/local-sink.url}}
  alert_ticket_url:
    file: ${ALERT_TICKET_URL_FILE:-../alertmanager/local-sink.url}

networks:
  iap-net:
    driver: bridge

services:
  # ------------------------------------------------------------ data pipeline
  data-generator:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.python
    image: ghcr.io/ashjha0/intraday-alpha-platform-python:v1.17.1
    container_name: iap-data-generator
    # Deterministic batch job: identical seed => bit-identical /data outputs
    # (configs/marketdata/generator.json pins seed 20260829). Runs to completion; the
    # replay services gate on successful completion, not on liveness.
    command: []
    restart: "no"
    networks: [iap-net]
    volumes:
      - iap-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import iap.marketdata"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------- replay services
  cpp-replay:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.cpp
    image: ghcr.io/ashjha0/intraday-alpha-platform-cpp:v1.17.1
    container_name: iap-cpp-replay
    # Deterministic replay + execution-sim pass over the golden vectors;
    # writes its methodology/results table to the shared volume.
    command: ["/data/results_cpp.md"]
    restart: "no"
    networks: [iap-net]
    volumes:
      - iap-data:/data
    depends_on:
      data-generator:
        condition: service_completed_successfully

  rust-replay:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.rust
    image: ghcr.io/ashjha0/intraday-alpha-platform-rust:v1.17.1
    container_name: iap-rust-replay
    command: ["/golden"]
    restart: "no"
    networks: [iap-net]
    volumes:
      - iap-data:/data
    depends_on:
      data-generator:
        condition: service_completed_successfully

  # ------------------------------------------------------- python platform
  # The Python MVP loop over the golden instrument (python -m iap.mvp run),
  # finite: it exits 0 when the stream ends, so `restart: on-failure`, NOT
  # `unless-stopped` (the container must not re-run the session forever).
  # `python -m iap.metrics run-session` maintains the session marker
  # /data/state/session_exit.json around it (RUNNING -> FINISHED / FAILED /
  # STOPPED) so platform-metrics can tell "finished" from "crashed" after
  # the process is gone (PLATFORM_CONVENTIONS.md §12.3). It writes
  # /data/mvp/golden (config.json first, report.json last).
  mvp-session:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.python
    image: ghcr.io/ashjha0/intraday-alpha-platform-python:v1.17.1
    container_name: iap-mvp-session
    entrypoint: ["python3", "-m", "iap.metrics", "run-session"]
    command:
      - --state-dir
      - /data/state
      - --runs-root
      - /data/mvp
      - "--"
      - python3
      - -m
      - iap.mvp
      - run
      - --config
      - /app/configs/mvp/mvp.json
      - --repo-root
      - /app
      - --out
      - /data/mvp/golden
    restart: on-failure
    networks: [iap-net]
    environment:
      # PLATFORM_CONVENTIONS.md §12.2: the bind mount below is what the
      # process actually loads (mvp.json and, through --repo-root, every
      # `reference` it names), so an operator edit plus a restart is a real
      # config change.
      IAP_CONFIG_DIR: /app/configs
      IAP_STATE_DIR: /data/state
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../../configs:/app/configs:ro
      - iap-data:/data
    depends_on:
      data-generator:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["NONE"]

  # The Python /metrics process (v1.17 F9; python/src/iap/metrics/). Serves
  # GET /metrics (Prometheus text), /health, /ready and /status on :8080 from
  # the live risk limits in configs/, the session marker and the newest MVP
  # run under /data/mvp — every metric and its source is listed in
  # python/src/iap/metrics/exporter.py; retired Java-only names are exposed
  # as <name>_available 0. Outlives the finite session (restart:
  # unless-stopped), state mounted READ-ONLY. There is no admin API.
  platform-metrics:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.python
    image: ghcr.io/ashjha0/intraday-alpha-platform-python:v1.17.1
    container_name: iap-platform-metrics
    entrypoint: ["python3", "-m", "iap.metrics", "serve", "--port", "8080"]
    command: []
    restart: unless-stopped
    networks: [iap-net]
    ports:
      # Loopback only: /metrics and /status are not for the LAN.
      - "127.0.0.1:8080:8080"
    environment:
      # The server defaults to 127.0.0.1 inside the container; bind all
      # interfaces so Prometheus (iap-net) and the published loopback port
      # reach it.
      IAP_BIND_ADDR: 0.0.0.0
      # §12.2: the exporter reads the risk limits from IAP_CONFIG_DIR, the
      # bind mount below — edit configs/risk/risk.json, restart, and
      # risk_limit{...} moves with it.
      IAP_CONFIG_DIR: /app/configs
      IAP_STATE_DIR: /data/state
      IAP_RUNS_ROOT: /data/mvp
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../../configs:/app/configs:ro
      - iap-data:/data:ro
    depends_on:
      data-generator:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Real check against the live /health endpoint (stdlib only; the
      # python image has no curl/wget).
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    container_name: iap-prometheus
    restart: unless-stopped
    networks: [iap-net]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/recording.yml:/etc/prometheus/recording.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../prometheus/slo.yml:/etc/prometheus/slo.yml:ro
      - prom-data:/prometheus
    depends_on:
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null || promtool check healthy >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: iap-alertmanager
    restart: unless-stopped
    networks: [iap-net]
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    # Receiver URLs are secrets (they usually embed a token): read from these
    # files at send time (alertmanager.yml `url_file`), never written into the
    # config. Default: the local alert-sink (see top-level `secrets:`).
    secrets:
      - source: alert_page_url
        target: /etc/alertmanager/secrets/page_url
      - source: alert_ticket_url
        target: /etc/alertmanager/secrets/ticket_url
    depends_on:
      - alert-sink
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Local default alert receiver (v1.12 P4): a stdlib-only HTTP echo that logs
  # every Alertmanager webhook POST to stdout. Internal to iap-net (no host
  # port). Replaced by setting ALERT_PAGE_URL_FILE / ALERT_TICKET_URL_FILE.
  alert-sink:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.python
    image: ghcr.io/ashjha0/intraday-alpha-platform-python:v1.17.1
    container_name: iap-alert-sink
    restart: unless-stopped
    networks: [iap-net]
    entrypoint:
      - python3
      - -c
      - |
        import http.server
        class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
                body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                print(self.path, body.decode("utf-8", "replace"), flush=True)
                self.send_response(200)
                self.end_headers()
            def log_message(self, *args):
                pass
        http.server.ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
    healthcheck:
      test: ["NONE"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    container_name: iap-grafana
    restart: unless-stopped
    networks: [iap-net]
    ports:
      - "3000:3000"
    environment:
      # Secrets stay OUT of source control (SECURITY.md): the admin password
      # comes from the host environment / an .env file that is git-ignored.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the environment}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
