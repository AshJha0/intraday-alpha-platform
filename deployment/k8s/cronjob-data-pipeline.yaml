# =============================================================================
# Daily data pipeline (docs/BUILD_NOTES.md: python3 -m iap.marketdata):
# generator -> data/raw/*.jsonl -> normalize -> data/normalized/{jsonl,iap1,
# parquet,qc_report.json} on the shared iap-data PVC.
#
# Schedule: 07:30 UTC daily (before EU/US overlap analysis windows; the
# pipeline is deterministic, so a re-run after failure is safe and produces
# bit-identical output for the pinned seed in configs/marketdata/generator.json).
# Runbook: docs/runbooks/RUNBOOK_data_pipeline.md
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-pipeline
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/name: data-pipeline
    app.kubernetes.io/component: data
    app.kubernetes.io/version: "1.0.0"
spec:
  schedule: "30 7 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid        # never two writers on the data volume
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: intraday-alpha-platform
        app.kubernetes.io/name: data-pipeline
        app.kubernetes.io/component: data
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: intraday-alpha-platform
            app.kubernetes.io/name: data-pipeline
            app.kubernetes.io/component: data
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pipeline
              # Release step: `python tools/release.py publish` pins this by
              # digest from release-manifest.json (...:v1.17.0@sha256:...).
              image: ghcr.io/ashjha0/intraday-alpha-platform-python:v1.17.1@sha256:4cef6217422e91c64de7b5e15f4f6ba07f3fc5b04cc5bebb95e835ac263c8f37
              imagePullPolicy: IfNotPresent
              # Configs from the ConfigMap (not the baked copy) so a config
              # change does not require an image rebuild; every config change
              # is audit-logged per docs/governance/GOVERNANCE.md.
              #
              # `command` REPLACES the image ENTRYPOINT rather than appending
              # to it: the entrypoint already carries --configs-dir/--out, and
              # appending relied on argparse keeping the last occurrence of a
              # repeated option — which stops working the moment the CLI grows
              # a positional argument (round-3 PLATFORM SEV-3).
              command: ["python3", "-m", "iap.marketdata"]
              args: ["--configs-dir", "/etc/iap/configs", "--out", "/data"]
              volumeMounts:
                - name: configs
                  mountPath: /etc/iap/configs
                  readOnly: true
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: configs
              configMap:
                name: iap-configs
                # Every key is a configs/-relative path with '/' encoded as '__'
                # (ConfigMap keys may not contain '/'); items[].path projects the
                # nested domain tree (PLATFORM_CONVENTIONS.md §0) back under
                # IAP_CONFIG_DIR. Generated from generate_configmaps.py
                # configmap_items() — check_deployment.py fails if this drifts.
                items:
                  - key: agents__llm.json
                    path: agents/llm.json
                  - key: execution__execution.json
                    path: execution/execution.json
                  - key: instruments__instruments.json
                    path: instruments/instruments.json
                  - key: marketdata__generator.json
                    path: marketdata/generator.json
                  - key: mvp__generator.json
                    path: mvp/generator.json
                  - key: mvp__generator_tiny.json
                    path: mvp/generator_tiny.json
                  - key: mvp__instruments.json
                    path: mvp/instruments.json
                  - key: mvp__mvp.json
                    path: mvp/mvp.json
                  - key: mvp__mvp_tiny.json
                    path: mvp/mvp_tiny.json
                  - key: mvp__venues.json
                    path: mvp/venues.json
                  - key: paper__paper_trade.json
                    path: paper/paper_trade.json
                  - key: prereg__v2.json
                    path: prereg/v2.json
                  - key: prereg__v3.json
                    path: prereg/v3.json
                  - key: reference__auction_entry_cutoffs.json
                    path: reference/auction_entry_cutoffs.json
                  - key: reference__event_calendar.json
                    path: reference/event_calendar.json
                  - key: reference__fee_tiers.json
                    path: reference/fee_tiers.json
                  - key: reference__llm_prices.json
                    path: reference/llm_prices.json
                  - key: reference__reference_etf_map_v1.json
                    path: reference/reference_etf_map_v1.json
                  - key: reference__regulatory_fee_schedule.json
                    path: reference/regulatory_fee_schedule.json
                  - key: reference__sectors.json
                    path: reference/sectors.json
                  - key: reference__venue_latency.json
                    path: reference/venue_latency.json
                  - key: risk__portfolio_limits.json
                    path: risk/portfolio_limits.json
                  - key: risk__risk.json
                    path: risk/risk.json
                  - key: strategies__alpha_params.json
                    path: strategies/alpha_params.json
                  - key: strategies__lifecycle.json
                    path: strategies/lifecycle.json
                  - key: strategies__strategies.json
                    path: strategies/strategies.json
                  - key: templates__regulatory_fees.json
                    path: templates/regulatory_fees.json
                  - key: venues__venues.json
                    path: venues/venues.json
            - name: data
              persistentVolumeClaim:
                claimName: iap-data
