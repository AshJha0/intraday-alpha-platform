# =============================================================================
# state-backup — periodic copy of the platform state volume (v1.12.0, plan
# P4 "HA for single-PVC state"; v1.17 F9: the volume is the Python
# platform-metrics pod's iap-platform-state, the image is the python image).
# Runbook: docs/runbooks/RUNBOOK_alerting.md §4 (backup / restore / node loss).
#
# WHAT HA MEANS HERE (and what it does not):
#   - The session is a SINGLETON (platform-metrics.yaml): replicas 1, strategy
#     Recreate, ReadWriteOnce iap-platform-state claim. There is NO
#     active-active and NO hot standby: two strategy/risk loops without a
#     fenced leader would duplicate orders the moment a venue adapter is wired.
#     Leader election (a coordination.k8s.io Lease) is NOT implemented — RWO +
#     Recreate is the fence.
#   - Recovery is RESTART: on pod loss Kubernetes reschedules the one pod; it
#     re-attaches the claim with the marker and the MVP artefacts intact
#     (PLATFORM_CONVENTIONS.md §12.3). The MVP loop is deterministic and
#     finite, so a rerun reproduces the same artefacts; there is no --resume
#     of a half-run session.
#   - What this CronJob adds: if the VOLUME itself is lost or corrupted, the
#     session marker, the risk audit and the decision traces can be restored
#     from the newest archive on iap-platform-state-backup.
#
# HOW IT READS AN RWO CLAIM SAFELY: ReadWriteOnce is per NODE, not per pod. The
# job (a) mounts the claim READ-ONLY and (b) carries a REQUIRED pod affinity to
# the platform-metrics pod on the same hostname, so it only ever runs on the
# node that already has the volume attached — never a Multi-Attach, never a
# second writer. If platform-metrics is not running (rescheduling), the job
# stays Pending and is reaped by activeDeadlineSeconds: no backup is taken of
# a volume nobody is writing. tests/harness/check_deployment.py
# (`k8s_state_backup`) pins all of this.
#
# Consistency: the job copies the session marker (session_exit.json) FIRST
# and every other file after it. report.json is written LAST by the MVP run,
# so an archive holding a report holds the complete run; an archive taken
# mid-run holds a RUNNING marker and partial traces, which a rerun replaces.
# Restore procedure: the runbook §4.
#
# Off-cluster copy: iap-platform-state-backup is in-cluster storage. For
# disaster recovery, ship the archives off-cluster (object storage) —
# operator-owned, not in this repo.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: state-backup
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/name: state-backup
    app.kubernetes.io/component: storage
spec:
  schedule: "*/30 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: intraday-alpha-platform
        app.kubernetes.io/name: state-backup
        app.kubernetes.io/component: storage
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: intraday-alpha-platform
            app.kubernetes.io/name: state-backup
            app.kubernetes.io/component: storage
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: platform-metrics
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              # Same image as platform-metrics (coreutils + tar); no network use.
              image: ghcr.io/ashjha0/intraday-alpha-platform-python:v1.18.0@sha256:ac559d916b6e9cfb4ad812ec53420a31ecb40727411011ff8fdc452d859d65b4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  test -d /data/state || { echo "no /data/state yet; nothing to back up"; exit 0; }
                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  stage="/backup/.staging-$ts"
                  mkdir -p "$stage/state"
                  # marker first, then everything else (see header)
                  if [ -f /data/state/session_exit.json ]; then
                    cp -p /data/state/session_exit.json "$stage/state/"
                  fi
                  for f in /data/state/* /data/state/.[!.]*; do
                    [ -e "$f" ] || continue
                    [ "$(basename "$f")" = session_exit.json ] && continue
                    cp -rp "$f" "$stage/state/"
                  done
                  # the MVP run artefacts (traces, risk audit, report)
                  if [ -d /data/mvp ]; then
                    cp -rp /data/mvp "$stage/mvp"
                  fi
                  tar -czf "/backup/.state-$ts.tgz.partial" -C "$stage" .
                  rm -rf "$stage"
                  mv "/backup/.state-$ts.tgz.partial" "/backup/state-$ts.tgz"
                  # keep the newest 96 archives (2 days at */30)
                  ls -1t /backup/state-*.tgz | tail -n +97 | xargs -r rm -f
                  echo "backup ok: state-$ts.tgz"
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: iap-platform-state
                readOnly: true
            - name: backup
              persistentVolumeClaim:
                claimName: iap-platform-state-backup
