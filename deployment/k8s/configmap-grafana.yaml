data:
  market_data_latency.json: |
    {
      "uid": "iap-md-latency",
      "title": "Market Data & Latency",
      "description": "Feed health, stream QC and hot-path tail latency (spec \u00a722/\u00a725). Metric mapping: deployment/grafana/README.md. RETIRED with the Java image (v1.17 F9): panels on decode_latency_ns, book_update_latency_ns, jvm_gc_pause_ns, md_event_time_gap_seconds, book_stale and risk_session_restarts_total were removed (no Python producer; each name is exposed as <name>_available 0 by the platform-metrics exporter).",
      "tags": [
        "iap",
        "market-data",
        "latency"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "graphTooltip": 1,
      "timezone": "utc",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "annotations": {
        "list": []
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Feed status (events in last 1m)",
          "description": "Normalized market events/sec from the Python platform-metrics exporter. A 5s event-time gap trips the StaleFeed page (risk.json stale_feed_timeout_ns).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.001
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(md_events_total[1m])) or vector(0)",
              "legendFormat": "events/s",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Sequence gap rate (5m)",
          "description": "Any sustained gaps => books stale; SequenceGapRate alert at 0.1/s.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(job:md_sequence_gaps:rate5m)",
              "legendFormat": "gaps/s",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Session state",
          "description": "platform_session_state: 0 STARTING, 1 RUNNING, 2 FINISHED, 3 FAILED, 4 STOPPED (PLATFORM_CONVENTIONS.md \u00a712.6). A paper session is finite: FINISHED is the normal terminal state; STOPPED is an operator or signal stop that checkpointed and can be resumed. While no trading process is running the panel falls back to the last persisted state (platform_persisted_session_state, served by the platform-metrics exporter), so a clean stop, a finished session or a failed one stays visible; a crashed session shows no data (see the TargetDown alert).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "STARTING",
                      "index": 0
                    },
                    "1": {
                      "text": "RUNNING",
                      "index": 1
                    },
                    "2": {
                      "text": "FINISHED",
                      "index": 2
                    },
                    "3": {
                      "text": "FAILED",
                      "index": 3
                    },
                    "4": {
                      "text": "STOPPED",
                      "index": 4
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  },
                  {
                    "color": "text",
                    "value": 2
                  },
                  {
                    "color": "red",
                    "value": 3
                  },
                  {
                    "color": "orange",
                    "value": 4
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(platform_session_state) or max(platform_persisted_session_state >= 2)",
              "legendFormat": "state",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Market-data events/sec",
          "description": "Normalized event throughput per service (spec \u00a725 market-data health).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "job:md_events:rate5m",
              "legendFormat": "md {{service}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Stream QC: sequence gaps / duplicates (per sec)",
          "description": "Gap and duplicate counters, LIVE from the Python platform-metrics exporter and updated on EVERY event (max_sequence_gap_before_halt = 1, so a single gap must be visible on the next scrape). The SequenceGapDetected alert uses increase(...) > 0, not a rate.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "job:md_sequence_gaps:rate5m",
              "legendFormat": "sequence gaps {{service}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "job:md_duplicates:rate5m",
              "legendFormat": "duplicates {{service}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Order path latency decision-to-wire (p50/p99/p999)",
          "description": "order_path_latency_ns: per parent order, arrival_ts - decision_ts (decision -> pre-trade risk -> venue arrival) from the MVP run's traces.jsonl, built into a log2 histogram by the Python platform-metrics exporter; histogram_quantile reports the bucket's inclusive upper bound (within one power of two above the exact value).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ns",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "job:order_path_latency_ns:p50",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "job:order_path_latency_ns:p99",
              "legendFormat": "p99",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "job:order_path_latency_ns:p999",
              "legendFormat": "p999",
              "refId": "C"
            }
          ]
        }
      ]
    }
