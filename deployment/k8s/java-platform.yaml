# =============================================================================
# java-platform — the institutional strategy/monitoring layer (iap/java image,
# deployment/docker/Dockerfile.java).
#
# The container runs the paper-trading vertical (com.iap.platform.PaperTrading
# — see Dockerfile.java): golden-vector session paced 60x realtime, with the
# monitoring API (com.iap.api.MetricsServer) LIVE on :8080 — /metrics
# (Prometheus text), /health (liveness), /ready (readiness), /status, and
# POST /admin/{kill,clear,override,roll} when an admin token is provided.
#
# SINGLETON (PLATFORM_CONVENTIONS.md §12.7): replicas 1 + strategy Recreate.
# Two copies of a strategy/risk loop with no leader election duplicate orders
# the moment a real venue adapter is wired, and the state PVC is
# ReadWriteOnce — a second replica (or a RollingUpdate surge pod) hits
# Multi-Attach. There is deliberately no PodDisruptionBudget: minAvailable 1
# on a single replica blocks every node drain.
#
# CONFIG (§12.2): the entrypoint reads $IAP_CONFIG_DIR, so the iap-configs
# ConfigMap mounted at /etc/iap/configs is what the process actually loads —
# the kill-switch runbook's "regenerate the ConfigMap, rollout restart" path
# is real. STATE (§12.3): /data/state on the iap-java-state PVC holds the risk
# snapshot, session accounting and the audit JSONL, so a restart resumes
# instead of starting flat and un-latched. The claim is separate from the
# data-pipeline CronJob's iap-data on purpose: a ReadWriteOnce claim shared by
# two workloads either pins them to one node or fails with Multi-Attach, and
# the trading state must not share a lifecycle with regenerable market data.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-platform
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/name: java-platform
    app.kubernetes.io/component: strategy-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: java-platform
  strategy:
    # A trading singleton: never two loops at once, not even for a rollout
    # second. Recreate stops the old pod before the new one starts, which also
    # keeps the ReadWriteOnce PVC single-attach.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: intraday-alpha-platform
        app.kubernetes.io/name: java-platform
        app.kubernetes.io/component: strategy-platform
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false   # no API access needed
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: java-platform
          # Release step: pin by digest from release-manifest.json
          # (ghcr.io/ashjha0/intraday-alpha-platform-java:v1.8.0@sha256:...).
          image: ghcr.io/ashjha0/intraday-alpha-platform-java:v1.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_OPTS
              # -XX:-UsePerfData: no /tmp/hsperfdata_* mmap file, so the
              # JVM needs no writable root filesystem (only the /tmp emptyDir).
              value: "-XX:+UseZGC -XX:-UsePerfData -Xms256m -Xmx768m -Xlog:gc*:stdout:time,level,tags"
            # The server binds 127.0.0.1 by default; inside the pod it must
            # listen on all interfaces so the kubelet probes and Prometheus
            # (reached only through the NetworkPolicies) can connect.
            - name: IAP_BIND_ADDR
              value: 0.0.0.0
            - name: IAP_CONFIG_DIR
              value: /etc/iap/configs
            - name: IAP_STATE_DIR
              value: /data/state
            # Kill-switch admin API (PLATFORM_CONVENTIONS.md §12.5). The token
            # lives in the iap-admin-token Secret, created out of band:
            #   kubectl -n intraday-alpha create secret generic iap-admin-token \
            #     --from-literal=token="$(openssl rand -hex 32)"
            # optional: with no Secret the /admin/* routes are not registered.
            - name: IAP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iap-admin-token
                  key: token
                  optional: true
          volumeMounts:
            - name: configs
              mountPath: /etc/iap/configs
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          # Real probes that can actually fail (PLATFORM_CONVENTIONS.md §12.5).
          # startupProbe covers config load + JSONL decode of the vector, so a
          # slow start is not mistaken for a wedged process.
          startupProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 5
            failureThreshold: 24        # up to 2 minutes to decode and start
            timeoutSeconds: 5
          # liveness: 503 when the session FAILED or the trading loop has not
          # advanced for 30s with events pending. A latched kill switch is NOT
          # unhealthy — halted is a deliberate state.
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # readiness: 503 before the first event, after the session FINISHES,
          # and (realtime mode) when no event has been processed within
          # stale_feed_timeout_ns of wall clock — a stalled feed takes the pod
          # out of the Service without killing it.
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # writes only to /tmp (emptyDir) and /data (PVC)
            capabilities:
              drop: ["ALL"]
        # Last persisted session state (PLATFORM_CONVENTIONS.md §12.3). The
        # trading JVM exits right after a clean stop, so its own
        # platform_session_state=4 is almost never scraped; the trading thread
        # writes session_exit.json and this sidecar, which outlives it, serves
        # it as platform_persisted_session_state on :9102 (Service
        # java-platform-state; alerts.yml SessionStoppedNotResumed). It reads
        # the state READ-ONLY and is not part of trading: the pod's /ready
        # (and so the java-platform Service) is still driven by the trading
        # container alone, which stays not-Ready while stopped.
        - name: session-state
          image: ghcr.io/ashjha0/intraday-alpha-platform-java:v1.8.0
          imagePullPolicy: IfNotPresent
          command: ["java", "-Xmx64m", "-XX:-UsePerfData", "-cp", "/app/classes", "com.iap.platform.SessionStateExporter", "--state-dir", "/data/state", "--port", "9102"]
          ports:
            - name: state
              containerPort: 9102
              protocol: TCP
          env:
            - name: IAP_BIND_ADDR
              value: 0.0.0.0
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet: { path: /health, port: state }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: configs
          configMap:
            name: iap-configs
            # Every key is a configs/-relative path with '/' encoded as '__'
            # (ConfigMap keys may not contain '/'); items[].path projects the
            # nested domain tree (PLATFORM_CONVENTIONS.md §0) back under
            # IAP_CONFIG_DIR. Generated from generate_configmaps.py
            # configmap_items() — check_deployment.py fails if this drifts.
            items:
              - key: execution__execution.json
                path: execution/execution.json
              - key: instruments__instruments.json
                path: instruments/instruments.json
              - key: marketdata__generator.json
                path: marketdata/generator.json
              - key: mvp__generator.json
                path: mvp/generator.json
              - key: mvp__generator_tiny.json
                path: mvp/generator_tiny.json
              - key: mvp__instruments.json
                path: mvp/instruments.json
              - key: mvp__mvp.json
                path: mvp/mvp.json
              - key: mvp__mvp_tiny.json
                path: mvp/mvp_tiny.json
              - key: mvp__venues.json
                path: mvp/venues.json
              - key: risk__risk.json
                path: risk/risk.json
              - key: strategies__alpha_params.json
                path: strategies/alpha_params.json
              - key: strategies__lifecycle.json
                path: strategies/lifecycle.json
              - key: strategies__strategies.json
                path: strategies/strategies.json
              - key: venues__venues.json
                path: venues/venues.json
        - name: data
          persistentVolumeClaim:
            claimName: iap-java-state   # its own claim; NOT the data-pipeline's iap-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: java-platform
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/name: java-platform
    app.kubernetes.io/component: strategy-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: java-platform
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
---
---
# The session-state sidecar's own Service. publishNotReadyAddresses is the
# point: java-platform is NOT Ready while a session is stopped or finished
# (/ready is 503), so the java-platform Service has no endpoints then — but
# "stopped and not resumed" must stay scrapeable. Only the read-only exporter
# port is published this way; the trading and admin port is not.
apiVersion: v1
kind: Service
metadata:
  name: java-platform-state
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/name: java-platform
    app.kubernetes.io/component: strategy-platform
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: java-platform
  ports:
    - name: state
      port: 9102
      targetPort: state
      protocol: TCP
---
# NOTE: no PodDisruptionBudget. This is a single-replica singleton; a PDB with
# minAvailable 1 would block every voluntary disruption (node drain, upgrade)
# and, because a paper session is finite, would block them while the pod is
# not even Ready. Draining this workload is safe: state is checkpointed to the
# PVC and the next pod resumes from it (PLATFORM_CONVENTIONS.md §12.3).
