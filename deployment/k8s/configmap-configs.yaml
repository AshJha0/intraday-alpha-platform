  marketdata__generator.json: "{\n  \"x-version\": 2,\n  \"description\": \"Synthetic market-data generator\
    \ config (iap.marketdata.generator). All randomness is SplitMix64 seeded from `seed`; identical seed\
    \ => bit-identical output files. Equities: ONE shared regime-switching efficient price per instrument\
    \ (sigma per sqrt-second, 1s grid) with per-venue bounded AR(1) microstructure noise (`venue_noise`)\
    \ and self-exciting MBO flow, so the consolidated multi-venue book stays uncrossed; `flow.calibration`\
    \ \\\"session\\\" (x-version 2, v1.4.0) calibrates the base rate for the self-excitation so `slots_per_stream`\
    \ expected flow slots span the whole session and flow reaches the close \u2014 \\\"legacy_budget\\\
    \" reproduces the v1.3.0 dataset (data_version 203c8f54...), whose equity flow stopped about 40% into\
    \ each session. FX streams are QUOTE+TRADE across LP1/LP2/PRI. `anomalies` are injected for QC testing\
    \ and disabled for golden vectors.\",\n  \"seed\": 20260829,\n  \"sessions\": 2,\n  \"equities\":\
    \ {\n    \"slots_per_stream\": 3850,\n    \"vol_regimes\": {\n      \"sigma_ticks_per_s\": [\n   \
    \     0.15,\n        0.4\n      ],\n      \"switch_prob_per_s\": 0.0007\n    },\n    \"venue_noise\"\
    : {\n      \"rho\": 0.9,\n      \"sigma_ticks\": 0.12,\n      \"max_ticks\": 0.45\n    },\n    \"\
    flow\": {\n      \"excitation_kick\": 1.4,\n      \"excitation_decay\": 0.82,\n      \"max_excitation\"\
    : 8.0,\n      \"calibration\": \"session\"\n    },\n    \"book\": {\n      \"max_resting_orders\"\
    : 160,\n      \"qty_lots_max\": 10\n    },\n    \"mix\": {\n      \"add\": 0.46,\n      \"cancel\"\
    : 0.26,\n      \"modify\": 0.12,\n      \"execute\": 0.16\n    },\n    \"halt\": {\n      \"instrument\"\
    : \"SYN.EQ.007\",\n      \"session_index\": 0,\n      \"duration_s\": 300\n    },\n    \"auction_prints\"\
    : 3\n  },\n  \"fx\": {\n    \"slots_per_pair\": 3300,\n    \"vol_regimes\": {\n      \"sigma_ticks\"\
    : [\n        0.8,\n        3.0\n      ],\n      \"switch_prob\": 0.003\n    },\n    \"spread_ticks\"\
    : {\n      \"PRI\": 2,\n      \"LP1\": 3,\n      \"LP2\": 5\n    },\n    \"trade_prob\": 0.12,\n \
    \   \"qty_units_max\": 20\n  },\n  \"anomalies\": {\n    \"gap_prob\": 0.0006,\n    \"gap_max_events\"\
    : 3,\n    \"dup_prob\": 0.0015,\n    \"ooo_prob\": 0.001,\n    \"invalid_prob\": 0.0005,\n    \"ts_violation_prob\"\
    : 0.0005\n  }\n}\n"
