# =============================================================================
# grafana — dashboards (deployment/grafana/). Provisioning + dashboard JSONs
# come from GENERATED ConfigMaps (configmap-grafana.yaml — regenerate with
# deployment/k8s/generate_configmaps.py after editing deployment/grafana/).
#
# Secrets separation (docs/GOVERNANCE.md): the admin password is NOT
# in this repo. Create it out-of-band before first apply:
#   kubectl -n intraday-alpha create secret generic iap-grafana-admin \
#     --from-literal=admin-user=admin --from-literal=admin-password='<strong>'
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/version: "11.1.0"
spec:
  replicas: 1
  strategy:
    type: Recreate   # the dashboards/state volume is ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: intraday-alpha-platform
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
        app.kubernetes.io/version: "11.1.0"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: iap-grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iap-grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_LOG_MODE      # stdout only: the root filesystem is read-only
              value: console
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: storage
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            # v1.14 (trivy KSV-0014): grafana writes only to /var/lib/grafana
            # (PVC: db, plugins, sessions) and /tmp (emptyDir); logs go to stdout
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: provisioning-datasources
          configMap:
            name: iap-grafana-provisioning
            items:
              - key: datasources-prometheus.yml
                path: prometheus.yml
        - name: provisioning-dashboards
          configMap:
            name: iap-grafana-provisioning
            items:
              - key: dashboards-provider.yml
                path: dashboards.yml
        - name: dashboards
          configMap:
            name: iap-grafana-dashboards
        - name: storage
          persistentVolumeClaim:
            claimName: iap-grafana   # users, preferences and ad-hoc dashboards survive restarts
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
