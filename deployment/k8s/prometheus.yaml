# =============================================================================
# prometheus — metrics store (spec §25). Config/rules come from the
# iap-prometheus-config ConfigMap (configmap-prometheus.yaml, GENERATED from
# deployment/prometheus/ — regenerate with deployment/k8s/generate_configmaps.py
# whenever prometheus.yml / recording.yml / alerts.yml change).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/version: "v2.53.0"
spec:
  replicas: 1
  strategy:
    type: Recreate   # single TSDB volume — never two writers
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: intraday-alpha-platform
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: observability
        app.kubernetes.io/version: "v2.53.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0   # digest-pin at release: @sha256:<record-me>
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: tsdb
              mountPath: /prometheus
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: iap-prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
              - key: recording.yml
                path: recording.yml
              - key: alerts.yml
                path: alerts.yml
              # '__' encodes '/' (ConfigMap keys cannot contain slashes):
              # lands at /etc/prometheus/targets/rust-telemetry.json.
              - key: targets__rust-telemetry.json
                path: targets/rust-telemetry.json
        - name: tsdb
          emptyDir: {}   # metrics are rebuildable; swap for a PVC to retain across restarts
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
