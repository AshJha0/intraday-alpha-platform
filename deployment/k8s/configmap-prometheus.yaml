# GENERATED FILE — do not edit by hand.
# Source of truth: deployment/prometheus/
# Regenerate: python3 deployment/k8s/generate_configmaps.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: iap-prometheus-config
  namespace: intraday-alpha
  labels:
    app.kubernetes.io/part-of: intraday-alpha-platform
    app.kubernetes.io/component: config
    app.kubernetes.io/managed-by: generate-configmaps
data:
  alerts.yml: "# =============================================================================\n# alerts.yml\
    \ \u2014 alert rules per spec \xA725 (observability) and \xA716 (risk).\n#\n# Severity policy:\n#\
    \   page     \u2014 trading correctness / capital at risk; wake someone up.\n#   critical \u2014 feed\
    \ or platform integrity degraded; act now during session.\n#   warning  \u2014 investigate the same\
    \ day.\n# Each alert links its runbook (docs/runbooks/).\n#\n# Rules (PLATFORM_CONVENTIONS.md \xA7\
    12.7):\n#   - every expression references a metric a component in THIS deployment\n#     actually\
    \ exports (\xA712.6 lists them); no aspirational targets.\n#   - annotations use Go text/template\
    \ + Prometheus's own functions only\n#     (humanize, humanizePercentage, printf). Sprig/Helm helpers\
    \ such as\n#     `default` are NOT defined and make Prometheus refuse the whole file.\n#   - thresholds\
    \ that mirror a config limit divide by the exported\n#     `risk_limit{limit=\"...\"}` gauge instead\
    \ of a hand-copied constant, so a\n#     GOVERNANCE \xA73 limit change cannot leave the alert behind.\n\
    #   - staleness is judged on EVENT time (md_event_time_gap_seconds), which is\n#     correct in replay\
    \ and live alike; wall-clock budgets are scoped to\n#     `platform_mode{mode=\"realtime\"}`.\n#\n\
    # Validated by `promtool check rules` and unit-tested by\n# `promtool test rules deployment/prometheus/tests/*.yml`,\
    \ both run by\n# tests/harness/check_deployment.py (and CI).\n#\n# RETIRED with the Java platform\
    \ image (v1.17 WS-F item F9, DECISION_N7).\n# The producer is now the Python platform-metrics process\n\
    # (python/src/iap/metrics/exporter.py). Every rule below reads a metric it\n# exports; the rules whose\
    \ only inputs were Java-only metrics were removed\n# rather than left evaluating to empty (\xA712.7\
    \ \"no aspirational targets\").\n# The exporter still exposes each retired name as `<name>_available\
    \ 0`, so\n# the retirement is visible at the scrape. Removed alerts -> Java metric:\n#   BookStale\
    \                  book_stale\n#   StaleFeed                  md_event_time_gap_seconds\n#   LiveVsBacktestDrift\
    \        alpha_live_vs_backtest_drift (DriftMonitor PSI)\n#   AlphaLifecycleRetired      alpha_lifecycle_state\
    \ (LifecycleGauge)\n#   RoutedVenueMismatch        risk_routed_venue_mismatch_total\n#   KillPendingNotRecorded\
    \     exec_orders_blocked_kill_pending_total\n#   ResumeReleasedOpenOrders   risk_resume_open_orders_released_total\n\
    #   GcPauseHigh                jvm_gc_pause_ns (there is no JVM)\n#   SessionRestartsClimbing    risk_session_restarts_total\
    \ (no --resume)\n#   AdminAuthRateLimited       admin_auth_rate_limited_total (no admin API)\n#  \
    \ AdminAuditSuppressed       admin_audit_suppressed_total (no admin API)\n#   EventPathLatencySLO*Burn\
    \   book_update_latency_ns (slo.yml)\n# The recording rules on decode_latency_ns, book_update_latency_ns,\n\
    # exec_slippage_bps and jvm_gc_pause_ns went with them (recording.yml), and\n# so did the Grafana\
    \ panels built on those names (deployment/grafana/).\n# =============================================================================\n\
    \ngroups:\n  - name: iap-market-data-health\n    rules:\n      # A single sequence gap marks the book\
    \ stale and fail-closes the risk\n      # engine (configs/risk/risk.json market_data.max_sequence_gap_before_halt\
    \ = 1),\n      # so ANY gap is the incident \u2014 a rate threshold would miss the one gap\n     \
    \ # that silently stops trading. The counter is exported on every event\n      # (PLATFORM_CONVENTIONS.md\
    \ \xA712.6), so this fires on the next scrape.\n      - alert: SequenceGapDetected\n        expr:\
    \ increase(md_sequence_gaps_total[5m]) > 0\n        for: 0m\n        labels:\n          severity:\
    \ critical\n          domain: market-data\n        annotations:\n          summary: \"Sequence gap\
    \ on {{ $labels.service }} ({{ $value | printf \\\"%.0f\\\" }} in 5m)\"\n          description: >-\n\
    \            At least one sequence gap. max_sequence_gap_before_halt = 1: the\n            affected\
    \ book is marked stale and the risk engine rejects orders\n            against it until a SNAPSHOT\
    \ recovers the stream. Check book_stale\n            for the instrument. Runbook:\n            docs/runbooks/RUNBOOK_data_pipeline.md#sequence-gaps\n\
    \          runbook: docs/runbooks/RUNBOOK_data_pipeline.md\n          runbook_url: docs/runbooks/RUNBOOK_data_pipeline.md\n\
    \n      # Wall-clock liveness of the feed, scoped to a PACED (realtime) session:\n      # a wedged\
    \ decoder thread stops advancing md_last_event_wallclock_unixtime\n      # even though event time\
    \ never moves either. Inhibited for replay\n      # (`asap`) sessions, whose wall-clock pacing is\
    \ meaningless \u2014 the Python\n      # MVP session is always `asap`, so this rule is armed but silent\
    \ until a\n      # paced Python session exists (kept: its inputs are all exported).\n      - alert:\
    \ FeedWallClockStall\n        expr: >\n          (time() - md_last_event_wallclock_unixtime) > 60\n\
    \          and on (job, instance) platform_mode{mode=\"realtime\"} == 1\n          and on (job, instance)\
    \ platform_session_state == 1\n        for: 1m\n        labels:\n          severity: page\n      \
    \    domain: market-data\n        annotations:\n          summary: \"No market event processed for\
    \ {{ $value | humanizeDuration }} on {{ $labels.service }}\"\n          description: >-\n        \
    \    A running realtime session has not processed an event in over a\n            minute of wall clock\
    \ \u2014 a wedged decode/trading thread or a dead\n            upstream. /health returns 503 after\
    \ 30s of no progress. Runbook:\n            docs/runbooks/RUNBOOK_shadow_deployment.md#feed-stall\n\
    \          runbook: docs/runbooks/RUNBOOK_shadow_deployment.md\n          runbook_url: docs/runbooks/RUNBOOK_shadow_deployment.md\n\
    \n  - name: iap-alpha-health\n    rules:\n      # Signal-rate collapse: alpha engine emitting far\
    \ below its trailing\n      # baseline while market data still flows.\n      - alert: SignalRateCollapse\n\
    \        expr: >\n          job:alpha_signals:rate5m\n            < 0.2 * (job:alpha_signals:rate5m\
    \ offset 1h)\n          and job:md_events:rate5m > 0\n        for: 10m\n        labels:\n        \
    \  severity: critical\n          domain: alpha\n        annotations:\n          summary: \"Alpha signal\
    \ rate collapsed on {{ $labels.service }}\"\n          description: >-\n            Signal rate under\
    \ 20% of its rate 1h ago while market data is\n            flowing \u2014 feature validity flags,\
    \ warmup state or a wedged engine.\n            NOTE: the demo deployment runs a FINITE session, so\
    \ `offset 1h`\n            baselines are only meaningful for a continuously running feed\n       \
    \     (RUNBOOK_shadow_deployment.md \xA71). Runbook:\n            docs/runbooks/RUNBOOK_shadow_deployment.md#signal-rate\n\
    \          runbook: docs/runbooks/RUNBOOK_shadow_deployment.md\n          runbook_url: docs/runbooks/RUNBOOK_shadow_deployment.md\n\
    \n  - name: iap-execution\n    rules:\n      # Fill rate over the PLATFORM's own execution counters\
    \ (exec_*, exported\n      # by the platform-metrics process from the MVP run's report.json \u2014\
    \n      # PLATFORM_CONVENTIONS.md \xA712.6).\n      # The previous version divided venue-simulator\
    \ counters that no deployed\n      # component ever wrote, so it could never fire.\n      - alert:\
    \ FillRateDrop\n        expr: >\n          job:exec_fill_rate:ratio5m < 0.5 * (job:exec_fill_rate:ratio5m\
    \ offset 1h)\n          and job:exec_orders:rate5m > 0.1\n        for: 10m\n        labels:\n    \
    \      severity: critical\n          domain: execution\n        annotations:\n          summary: \"\
    Fill rate dropped on {{ $labels.service }} ({{ $value | humanizePercentage }})\"\n          description:\
    \ >-\n            Fills per submitted child order below half their 1h-ago baseline\n            while\
    \ orders are flowing \u2014 queue-position model, venue health or\n            adverse regime shift.\
    \ Runbook:\n            docs/runbooks/RUNBOOK_shadow_deployment.md#fill-rate\n          runbook: docs/runbooks/RUNBOOK_shadow_deployment.md\n\
    \          runbook_url: docs/runbooks/RUNBOOK_shadow_deployment.md\n\n      # Pre-trade rejects are\
    \ normal in small numbers; a sustained majority\n      # means the strategy is fighting a limit (or\
    \ a stale book).\n      - alert: PreTradeRejectRatioHigh\n        expr: job:risk_rejected:ratio5m\
    \ > 0.5\n        for: 10m\n        labels:\n          severity: warning\n          domain: execution\n\
    \        annotations:\n          summary: \"{{ $value | humanizePercentage }} of pre-trade checks\
    \ rejected on {{ $labels.service }}\"\n          description: >-\n            More than half of all\
    \ risk decisions are rejects for 10m. Read the\n            rule_id distribution in the session's\
    \ risk_audit.jsonl\n            (<state-dir>/risk_audit.jsonl) before changing any limit.\n      \
    \      Runbook: docs/runbooks/RUNBOOK_shadow_deployment.md#rejects\n          runbook: docs/runbooks/RUNBOOK_shadow_deployment.md\n\
    \          runbook_url: docs/runbooks/RUNBOOK_shadow_deployment.md\n\n  - name: iap-risk\n    rules:\n\
    \      # Loss-limit utilization against the LIVE limit gauge (\xA712.6), so a\n      # GOVERNANCE\
    \ \xA73 limit change cannot leave this alert reading the old\n      # number. risk_daily_pnl is realized\
    \ + unrealized in the reporting\n      # currency, the same unit the limit is expressed in (\xA712.1).\n\
    \      - alert: LossLimitUtilizationHigh\n        expr: >-\n          (- risk_daily_pnl) / ignoring\
    \ (limit)\n            risk_limit{limit=\"max_daily_loss\"} > 0.75\n        for: 1m\n        labels:\n\
    \          severity: page\n          domain: risk\n        annotations:\n          summary: \"Daily\
    \ loss limit utilization {{ $value | humanizePercentage }}\"\n          description: >-\n        \
    \    Daily P&L (realized + unrealized, reporting currency) is below\n            -75% of global.max_daily_loss;\
    \ at 100% the risk engine latches the\n            global kill switch (fail-closed, audit-logged).\
    \ Runbook:\n            docs/runbooks/RUNBOOK_incident_kill_switch.md\n          runbook: docs/runbooks/RUNBOOK_incident_kill_switch.md\n\
    \          runbook_url: docs/runbooks/RUNBOOK_incident_kill_switch.md\n\n      # risk_kill_switch_engaged\
    \ carries no scope label (the gauge is the\n      # GLOBAL latch); scope detail lives in the audit\
    \ JSONL.\n      - alert: KillSwitchEngaged\n        expr: risk_kill_switch_engaged > 0\n        labels:\n\
    \          severity: page\n          domain: risk\n        annotations:\n          summary: \"Global\
    \ kill switch engaged on {{ $labels.service }}\"\n          description: >-\n            The global\
    \ kill switch latched \u2014 trading is halted and every order\n            in scope is rejected pre-trade.\
    \ The latch SURVIVES a restart\n            (PLATFORM_CONVENTIONS.md \xA712.3): a redeploy is not\
    \ a re-arm path.\n            Do NOT clear without following the incident runbook and risk\n     \
    \       approval. Scope and reason are in <state-dir>/risk_audit.jsonl.\n            Runbook: docs/runbooks/RUNBOOK_incident_kill_switch.md\n\
    \          runbook: docs/runbooks/RUNBOOK_incident_kill_switch.md\n          runbook_url: docs/runbooks/RUNBOOK_incident_kill_switch.md\n\
    \n      # Gross exposure against the live limit gauge (\xA712.6).\n      - alert: GrossNotionalUtilizationHigh\n\
    \        expr: >-\n          portfolio_gross_notional / ignoring (limit) group_left\n            risk_limit{limit=\"\
    max_gross_notional\"} > 0.9\n        for: 5m\n        labels:\n          severity: warning\n     \
    \     domain: risk\n        annotations:\n          summary: \"Gross notional at {{ $value | humanizePercentage\
    \ }} of the limit\"\n          description: >-\n            Gross exposure has been above 90% of global.max_gross_notional\
    \ for\n            5m; the next sizing decision will be rejected by the pre-trade\n            check.\
    \ Runbook: docs/runbooks/RUNBOOK_shadow_deployment.md#exposure\n          runbook: docs/runbooks/RUNBOOK_shadow_deployment.md\n\
    \          runbook_url: docs/runbooks/RUNBOOK_shadow_deployment.md\n\n  - name: iap-infrastructure\n\
    \    rules:\n\n      # The session aborted (config load, decode or accounting failure). The\n    \
    \  # process exits non-zero and `restart: on-failure` retries it.\n      - alert: PlatformSessionFailed\n\
    \        expr: platform_session_state == 3\n        for: 0m\n        labels:\n          severity:\
    \ page\n          domain: infrastructure\n        annotations:\n          summary: \"Paper-trading\
    \ session FAILED on {{ $labels.service }}\"\n          description: >-\n            platform_session_state\
    \ = 3 (FAILED): the session process exited\n            non-zero (python -m iap.metrics run-session\
    \ wrote the marker).\n            Check the session container's logs. Runbook:\n            docs/runbooks/RUNBOOK_shadow_deployment.md#failed-session\n\
    \          runbook: docs/runbooks/RUNBOOK_shadow_deployment.md\n          runbook_url: docs/runbooks/RUNBOOK_shadow_deployment.md\n\
    \n      # A STOPPED session (value 4: a stop was requested, the session\n      # checkpointed mid-stream\
    \ and exited 0) that nobody resumed. The\n      # trading process exits right after the checkpoint,\
    \ so its own gauge is\n      # almost never scraped at 4. The trading thread therefore also persists\n\
    \      # how the session ended (session_exit.json) and the platform-metrics\n      # exporter (python\
    \ -m iap.metrics serve, which outlives it) serves it as\n      # platform_persisted_session_state\
    \ for as long as the state volume\n      # exists. The alert fires on a persisted 4 unless a live\
    \ trading process\n      # reports RUNNING again (the resume window before the marker is\n      #\
    \ rewritten). A FINISHED session persists 2 and a crash leaves 1, so\n      # neither fires this;\
    \ a crash of the exporter is TargetDown on platform-metrics\n      # (RUNBOOK_shadow_deployment.md#stopped-session).\n\
    \      - alert: SessionStoppedNotResumed\n        expr: >-\n          platform_persisted_session_state\
    \ == 4\n          unless on(service) (platform_session_state == 1)\n        for: 10m\n        labels:\n\
    \          severity: warning\n          domain: infrastructure\n        annotations:\n          summary:\
    \ \"Paper-trading session STOPPED and not resumed on {{ $labels.service }}\"\n          description:\
    \ >-\n            The persisted session state is 4 (STOPPED) and no running\n            session has\
    \ reported for 10m. The session process was\n            interrupted and nothing restarted it. Rerun\
    \ the session (the\n            MVP loop is deterministic) or record why it stays down. The\n    \
    \        alert clears when a new session starts (the persisted state\n            becomes 1) or finishes\
    \ (2). Runbook:\n            docs/runbooks/RUNBOOK_shadow_deployment.md#stopped-session\n        \
    \  runbook: docs/runbooks/RUNBOOK_shadow_deployment.md\n          runbook_url: docs/runbooks/RUNBOOK_shadow_deployment.md\n\
    \n      # A scrape target disappearing is itself an incident. Every job in\n      # prometheus.yml\
    \ is a target that really exists (\xA712.7), so this can\n      # only fire on a real outage.\n  \
    \    - alert: TargetDown\n        expr: up == 0\n        for: 2m\n        labels:\n          severity:\
    \ critical\n          domain: infrastructure\n        annotations:\n          summary: \"Scrape target\
    \ {{ $labels.job }}/{{ $labels.instance }} down\"\n          description: >-\n            Prometheus\
    \ cannot scrape {{ $labels.instance }}. If this is\n            platform-metrics during a session,\
    \ treat as a platform\n            incident. Runbook: docs/runbooks/RUNBOOK_incident_kill_switch.md\n\
    \          runbook: docs/runbooks/RUNBOOK_incident_kill_switch.md\n          runbook_url: docs/runbooks/RUNBOOK_incident_kill_switch.md\n\
    \n  # Heartbeat: fires permanently by design. Alertmanager routes it to the\n  # `watchdog` receiver\
    \ (deployment/alertmanager/alertmanager.yml); an external\n  # dead-man's-switch on that receiver\
    \ turns \"this stopped arriving\" into the\n  # page, which proves rule evaluation, Alertmanager and\
    \ delivery are alive.\n  - name: iap-meta\n    rules:\n      - alert: Watchdog\n        expr: vector(1)\n\
    \        labels:\n          severity: none\n          domain: meta\n        annotations:\n       \
    \   summary: \"Alerting pipeline heartbeat (always firing)\"\n          description: >-\n        \
    \    This alert is always firing. If it stops arriving at the\n            heartbeat receiver, Prometheus\
    \ rule evaluation or Alertmanager is\n            down and no other alert can be trusted.\n      \
    \    runbook: docs/runbooks/RUNBOOK_incident_kill_switch.md\n          runbook_url: docs/runbooks/RUNBOOK_incident_kill_switch.md\n"
  prometheus.yml: "# =============================================================================\n#\
    \ prometheus.yml \u2014 Intraday Alpha Platform scrape configuration (spec \xA725)\n#\n# ONE source\
    \ of metrics: the Python platform-metrics process\n# (`python -m iap.metrics serve`, python/src/iap/metrics/)\
    \ on port 8080,\n# GET /metrics, Prometheus text exposition \u2014 plus Prometheus's own\n# self-scrape.\
    \ v1.17 (WS-F item F9, DECISION_N7): it replaces the Java\n# platform's com.iap.api.MetricsServer\
    \ and the java-platform-state exporter\n# (both served by the retired java image); the persisted session\
    \ state is\n# served from the same port, so the second job is gone.\n#\n# The `rust-telemetry` file-SD\
    \ job was REMOVED (round-3 PLATFORM finding\n# SEV-2): no Rust component ever wrote /data/telemetry/rust.prom,\
    \ so the\n# target was permanently down, `TargetDown` (critical) fired continuously, and\n# every\
    \ rule/panel built on venue_* was empty. Execution monitoring comes\n# from the platform's own exec_*\
    \ counters (PLATFORM_CONVENTIONS.md \xA712.6);\n# deployment/grafana/README.md records what is scraped\
    \ today. Re-add a job\n# here only together with a producer that actually writes the metrics.\n#\n\
    # Metric-name conventions (see deployment/grafana/README.md for the full\n# mapping): snake_case,\
    \ counters end in _total, latency histograms end in _ns\n# (fixed log2 buckets: _bucket{le=\"2^i -\
    \ 1\"}, powers of two in nanoseconds).\n# =============================================================================\n\
    \nglobal:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n  external_labels:\n    platform: intraday-alpha\n\
    \    env: local\n\nrule_files:\n  - /etc/prometheus/recording.yml\n  - /etc/prometheus/alerts.yml\n\
    \  - /etc/prometheus/slo.yml\n\n# Alert delivery: Alertmanager (deployment/alertmanager/). The same\
    \ hostname\n# resolves in docker-compose (service name) and Kubernetes (Service name).\nalerting:\n\
    \  alertmanagers:\n    - static_configs:\n        - targets: [\"alertmanager:9093\"]\n\nscrape_configs:\n\
    \  # The Python platform-metrics process (port 8080, /metrics \u2014 LIVE, served\n  # by `python\
    \ -m iap.metrics serve`): the live risk limits, the session\n  # marker (platform_persisted_session_state)\
    \ and the newest MVP run.\n  - job_name: platform-metrics\n    metrics_path: /metrics\n    static_configs:\n\
    \      - targets: [\"platform-metrics:8080\"]\n        labels:\n          service: platform-metrics\n\
    \          language: python\n\n  # Prometheus self-scrape (rule/alert health).\n  - job_name: prometheus\n\
    \    static_configs:\n      - targets: [\"localhost:9090\"]\n        labels:\n          service: prometheus\n"
  recording.yml: "# =============================================================================\n# recording.yml\
    \ \u2014 precomputed rates and tail-latency quantiles (spec \xA722/\xA725)\n#\n# Naming: level:metric:operation\
    \ per Prometheus recording-rule conventions.\n#\n# Every rule here reads a metric the deployment actually\
    \ exports\n# (PLATFORM_CONVENTIONS.md \xA712.6 / \xA712.7 \"no aspirational targets\"): the\n# Python\
    \ platform-metrics process (python/src/iap/metrics/exporter.py).\n# Rules for metrics with no producer\
    \ were removed rather than left\n# evaluating to empty: the rust venue-simulator counters and\n# md_out_of_order_total\
    \ (round 3), and with the Java image (v1.17 F9) the\n# log2-histogram quantiles of decode_latency_ns,\
    \ book_update_latency_ns,\n# exec_slippage_bps and jvm_gc_pause_ns \u2014 the Python exporter reads\
    \ the MVP\n# run's report.json, which carries latency percentiles, not the raw samples\n# a histogram\
    \ needs (deployment/grafana/README.md \"what is scraped today\").\n# =============================================================================\n\
    \ngroups:\n  - name: iap-event-rates\n    interval: 15s\n    rules:\n      # Market-data event throughput\
    \ (events/sec).\n      - record: job:md_events:rate5m\n        expr: sum by (job, service) (rate(md_events_total[5m]))\n\
    \n      # Sequence-gap / duplicate rates (per second). NOTE the alert on gaps is\n      # `increase(...)\
    \ > 0`, not a rate: one gap halts trading.\n      - record: job:md_sequence_gaps:rate5m\n        expr:\
    \ sum by (job, service) (rate(md_sequence_gaps_total[5m]))\n      - record: job:md_duplicates:rate5m\n\
    \        expr: sum by (job, service) (rate(md_duplicates_total[5m]))\n\n      # Alpha signal rate\
    \ and risk decision flow.\n      - record: job:alpha_signals:rate5m\n        expr: sum by (job, service)\
    \ (rate(alpha_signals_total[5m]))\n      - record: job:risk_decisions:rate5m\n        expr: sum by\
    \ (job, service) (rate(risk_decisions_total[5m]))\n\n      # Execution flow, from the platform's own\
    \ counters.\n      - record: job:exec_orders:rate5m\n        expr: sum by (job, service) (rate(exec_orders_submitted_total[5m]))\n\
    \      - record: job:exec_fills:rate5m\n        expr: sum by (job, service) (rate(exec_fills_total[5m]))\n\
    \      - record: job:exec_rejects:rate5m\n        expr: sum by (job, service) (rate(exec_child_orders_rejected_total[5m]))\n\
    \n      # Fill rate: fills over child orders actually submitted to the venue.\n      - record: job:exec_fill_rate:ratio5m\n\
    \        expr: >\n          sum by (job, service) (rate(exec_fills_total[5m]))\n          /\n    \
    \      clamp_min(sum by (job, service) (rate(exec_orders_submitted_total[5m])), 1e-9)\n\n      # Risk\
    \ rejection ratio.\n      - record: job:risk_rejected:ratio5m\n        expr: >\n          sum by (job,\
    \ service) (rate(risk_rejected_total[5m]))\n          /\n          clamp_min(sum by (job, service)\
    \ (rate(risk_decisions_total[5m])), 1e-9)\n\n  - name: iap-latency-quantiles\n    interval: 15s\n\
    \    rules:\n\n      - record: job:order_path_latency_ns:p50\n        expr: histogram_quantile(0.50,\
    \ sum by (job, le) (rate(order_path_latency_ns_bucket[5m])))\n      - record: job:order_path_latency_ns:p99\n\
    \        expr: histogram_quantile(0.99, sum by (job, le) (rate(order_path_latency_ns_bucket[5m])))\n\
    \      - record: job:order_path_latency_ns:p999\n        expr: histogram_quantile(0.999, sum by (job,\
    \ le) (rate(order_path_latency_ns_bucket[5m])))\n"
  slo.yml: "# =============================================================================\n# slo.yml\
    \ \u2014 latency SLO with multi-window, multi-burn-rate alerts (v1.12.0,\n# plan P4; Google SRE Workbook\
    \ ch. 5 \"Alerting on SLOs\").\n#\n# Source metric: the log2 histogram the Python platform-metrics\
    \ process\n# exports (PLATFORM_CONVENTIONS.md \xA712.6; python/src/iap/metrics/exporter.py)\n# \u2014\
    \ bucket upper bounds are 2^i - 1 ns, so an SLO threshold MUST be one of\n# those bounds. The SLO\
    \ uses le=\"1048575\" (2^20 - 1 ns ~= 1.05 ms): the\n# nearest bound above the measured cold p99 of\
    \ the event path\n# (<= 524,287 ns, benchmarks/RESULTS.md).\n#\n#   SLO                  objective\
    \                                 metric\n#   order-path-latency   99% of parents decision->arrival\
    \ < 1.05 ms  order_path_latency_ns\n#   window: 30 days rolling; error budget 1%.\n#\n# RETIRED (v1.17\
    \ F9, with the Java image): the event-path-latency SLO on\n# book_update_latency_ns. The Python exporter\
    \ reads the MVP run's artefacts;\n# the per-event book-apply latency was a Java in-process histogram\
    \ and has no\n# Python producer (the name is exposed as book_update_latency_ns_available 0).\n#\n\
    # error ratio(W) = 1 - good(W) / total(W)\n#   good  = rate(<metric>_bucket{le=\"1048575\"}[W])\n\
    #   total = rate(<metric>_count[W])\n# With no traffic the ratio is NaN and nothing fires (a finite\
    \ session that\n# has ended is not an SLO breach; liveness alerts cover a dead feed).\n#\n# Burn-rate\
    \ alerts (budget 0.01):\n#   *LatencySLOFastBurn  page     14.4x over 1h AND 5m   (2% of budget /\
    \ 1h)\n#                                 6x    over 6h AND 30m  (5% of budget / 6h)\n#   *LatencySLOSlowBurn\
    \  warning  3x    over 1d AND 2h   (10% of budget / 1d)\n#                                 1x    over\
    \ 3d AND 6h   (10% of budget / 3d)\n# Alertmanager inhibits the warning while the page for the same\
    \ `slo` and\n# `service` fires (deployment/alertmanager/alertmanager.yml).\n#\n# Caveat (documented,\
    \ not hidden): the histogram is rebuilt from the newest\n# run's traces on every scrape, so it is\
    \ cumulative per run; a new run\n# resets it, which rate() handles. Clock-quantisation: a log2 bucket\
    \ means\n# \"< 1.05 ms\" is exact at the bound \u2014 no interpolation is involved.\n# Unit tests:\
    \ deployment/prometheus/tests/slo_test.yml (promtool, CI).\n# =============================================================================\n\
    \ngroups:\n  - name: iap-slo-order-path-latency-recording\n    interval: 30s\n    rules:\n      -\
    \ record: job:order_path_latency_slo_errors:ratio_rate5m\n        expr: >-\n          1 - (\n    \
    \        sum by (job, service) (rate(order_path_latency_ns_bucket{le=\"1048575\"}[5m]))\n        \
    \    /\n            sum by (job, service) (rate(order_path_latency_ns_count[5m]))\n          )\n \
    \     - record: job:order_path_latency_slo_errors:ratio_rate30m\n        expr: >-\n          1 - (\n\
    \            sum by (job, service) (rate(order_path_latency_ns_bucket{le=\"1048575\"}[30m]))\n   \
    \         /\n            sum by (job, service) (rate(order_path_latency_ns_count[30m]))\n        \
    \  )\n      - record: job:order_path_latency_slo_errors:ratio_rate1h\n        expr: >-\n         \
    \ 1 - (\n            sum by (job, service) (rate(order_path_latency_ns_bucket{le=\"1048575\"}[1h]))\n\
    \            /\n            sum by (job, service) (rate(order_path_latency_ns_count[1h]))\n      \
    \    )\n      - record: job:order_path_latency_slo_errors:ratio_rate2h\n        expr: >-\n       \
    \   1 - (\n            sum by (job, service) (rate(order_path_latency_ns_bucket{le=\"1048575\"}[2h]))\n\
    \            /\n            sum by (job, service) (rate(order_path_latency_ns_count[2h]))\n      \
    \    )\n      - record: job:order_path_latency_slo_errors:ratio_rate6h\n        expr: >-\n       \
    \   1 - (\n            sum by (job, service) (rate(order_path_latency_ns_bucket{le=\"1048575\"}[6h]))\n\
    \            /\n            sum by (job, service) (rate(order_path_latency_ns_count[6h]))\n      \
    \    )\n      - record: job:order_path_latency_slo_errors:ratio_rate1d\n        expr: >-\n       \
    \   1 - (\n            sum by (job, service) (rate(order_path_latency_ns_bucket{le=\"1048575\"}[1d]))\n\
    \            /\n            sum by (job, service) (rate(order_path_latency_ns_count[1d]))\n      \
    \    )\n      - record: job:order_path_latency_slo_errors:ratio_rate3d\n        expr: >-\n       \
    \   1 - (\n            sum by (job, service) (rate(order_path_latency_ns_bucket{le=\"1048575\"}[3d]))\n\
    \            /\n            sum by (job, service) (rate(order_path_latency_ns_count[3d]))\n      \
    \    )\n  - name: iap-slo-order-path-latency-alerts\n    rules:\n      - alert: OrderPathLatencySLOFastBurn\n\
    \        expr: >-\n          (\n            job:order_path_latency_slo_errors:ratio_rate1h > (14.4\
    \ * 0.01)\n            and job:order_path_latency_slo_errors:ratio_rate5m > (14.4 * 0.01)\n      \
    \    )\n          or\n          (\n            job:order_path_latency_slo_errors:ratio_rate6h > (6\
    \ * 0.01)\n            and job:order_path_latency_slo_errors:ratio_rate30m > (6 * 0.01)\n        \
    \  )\n        for: 2m\n        labels:\n          severity: page\n          domain: latency\n    \
    \      slo: order-path-latency\n        annotations:\n          summary: \"order-path-latency SLO\
    \ fast burn on {{ $labels.service }}\"\n          description: >-\n            The decision-to-wire\
    \ order path (incl. the pre-trade risk check) is burning its 30-day error budget (99% under\n    \
    \        1.05 ms) at 6x or more: at this rate the budget is gone in days.\n            Check job:order_path_latency_ns:p99\
    \ and the venue latency realism\n            of the run (configs/prereg/v3.json). Runbook: docs/runbooks/RUNBOOK_alerting.md#latency-slo\n\
    \          runbook: docs/runbooks/RUNBOOK_alerting.md\n          runbook_url: docs/runbooks/RUNBOOK_alerting.md#latency-slo\n\
    \n      - alert: OrderPathLatencySLOSlowBurn\n        expr: >-\n          (\n            job:order_path_latency_slo_errors:ratio_rate1d\
    \ > (3 * 0.01)\n            and job:order_path_latency_slo_errors:ratio_rate2h > (3 * 0.01)\n    \
    \      )\n          or\n          (\n            job:order_path_latency_slo_errors:ratio_rate3d >\
    \ (1 * 0.01)\n            and job:order_path_latency_slo_errors:ratio_rate6h > (1 * 0.01)\n      \
    \    )\n        for: 30m\n        labels:\n          severity: warning\n          domain: latency\n\
    \          slo: order-path-latency\n        annotations:\n          summary: \"order-path-latency\
    \ SLO slow burn on {{ $labels.service }}\"\n          description: >-\n            The decision-to-wire\
    \ order path (incl. the pre-trade risk check) is consuming its 30-day error budget (99% under\n  \
    \          1.05 ms) faster than it accrues. Not urgent; investigate the same\n            day. Runbook:\
    \ docs/runbooks/RUNBOOK_alerting.md#latency-slo\n          runbook: docs/runbooks/RUNBOOK_alerting.md\n\
    \          runbook_url: docs/runbooks/RUNBOOK_alerting.md#latency-slo\n"
