# =============================================================================
# alertmanager.yml — routing for the alerts in deployment/prometheus/alerts.yml
#
# Single source of truth for both targets: docker-compose mounts this file,
# and deployment/k8s/configmap-alertmanager.yaml is GENERATED from it
# (deployment/k8s/generate_configmaps.py).
#
# The receiver is a generic webhook. Its URL is a SECRET (it normally embeds a
# token), so it is never written here: `url_file` makes Alertmanager read it
# from a mounted file at send time —
#   docker-compose: the `alert_webhook_url` secret (ALERT_WEBHOOK_URL_FILE)
#   Kubernetes:     the `iap-alertmanager-webhook` Secret, key `url`
# The in-repo placeholder (deployment/alertmanager/webhook_url.placeholder)
# points nowhere; with it, alerts are routed and visible in the Alertmanager
# UI but not delivered. Real delivery therefore needs the operator to supply a
# URL — see docs/governance/REPO_SETTINGS.md ("Operational settings").
#
# Watchdog is the always-firing heartbeat from alerts.yml. It is sent to the
# `watchdog` receiver (a no-op here). To get a dead-man's-switch, point that
# receiver at an external heartbeat service that pages when it STOPS arriving.
# =============================================================================
global:
  resolve_timeout: 5m

route:
  receiver: webhook
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - alertname = "Watchdog"
      receiver: watchdog
      group_wait: 0s
      repeat_interval: 1m

receivers:
  - name: webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
  - name: watchdog
