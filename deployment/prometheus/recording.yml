# =============================================================================
# recording.yml — precomputed rates and tail-latency quantiles (spec §22/§25)
#
# Histogram note: the live Java monitoring endpoint (com.iap.api.MetricsServer)
# exposes fixed log2 histograms — bucket upper bounds are 0, 1, 3, 7, ...,
# 2^i - 1 nanoseconds. histogram_quantile therefore returns a value within one
# power of two ABOVE the true order statistic (conservative for latency);
# benchmarks/RESULTS.md holds the exact offline numbers.
# Naming: level:metric:operation per Prometheus recording-rule conventions.
#
# Every rule here reads a metric the deployment actually exports
# (PLATFORM_CONVENTIONS.md §12.6 / §12.7 "no aspirational targets"). Rules for
# metrics with no producer — the rust venue-simulator counters and
# md_out_of_order_total — were removed rather than left evaluating to empty
# (see deployment/grafana/README.md "what is scraped today").
# =============================================================================

groups:
  - name: iap-event-rates
    interval: 15s
    rules:
      # Market-data event throughput (events/sec).
      - record: job:md_events:rate5m
        expr: sum by (job, service) (rate(md_events_total[5m]))

      # Sequence-gap / duplicate rates (per second). NOTE the alert on gaps is
      # `increase(...) > 0`, not a rate: one gap halts trading.
      - record: job:md_sequence_gaps:rate5m
        expr: sum by (job, service) (rate(md_sequence_gaps_total[5m]))
      - record: job:md_duplicates:rate5m
        expr: sum by (job, service) (rate(md_duplicates_total[5m]))

      # Alpha signal rate and risk decision flow.
      - record: job:alpha_signals:rate5m
        expr: sum by (job, service) (rate(alpha_signals_total[5m]))
      - record: job:risk_decisions:rate5m
        expr: sum by (job, service) (rate(risk_decisions_total[5m]))

      # Execution flow, from the platform's own counters.
      - record: job:exec_orders:rate5m
        expr: sum by (job, service) (rate(exec_orders_submitted_total[5m]))
      - record: job:exec_fills:rate5m
        expr: sum by (job, service) (rate(exec_fills_total[5m]))
      - record: job:exec_rejects:rate5m
        expr: sum by (job, service) (rate(exec_child_orders_rejected_total[5m]))

      # Fill rate: fills over child orders actually submitted to the venue.
      - record: job:exec_fill_rate:ratio5m
        expr: >
          sum by (job, service) (rate(exec_fills_total[5m]))
          /
          clamp_min(sum by (job, service) (rate(exec_orders_submitted_total[5m])), 1e-9)

      # Risk rejection ratio.
      - record: job:risk_rejected:ratio5m
        expr: >
          sum by (job, service) (rate(risk_rejected_total[5m]))
          /
          clamp_min(sum by (job, service) (rate(risk_decisions_total[5m])), 1e-9)

  - name: iap-latency-quantiles
    interval: 15s
    rules:
      # p50 / p99 / p999 for each hot-path histogram (nanoseconds).
      # Market-data decode (LIVE from java: decode_latency_ns).
      - record: job:decode_latency_ns:p50
        expr: histogram_quantile(0.50, sum by (job, le) (rate(decode_latency_ns_bucket[5m])))
      - record: job:decode_latency_ns:p99
        expr: histogram_quantile(0.99, sum by (job, le) (rate(decode_latency_ns_bucket[5m])))
      - record: job:decode_latency_ns:p999
        expr: histogram_quantile(0.999, sum by (job, le) (rate(decode_latency_ns_bucket[5m])))

      # Order-book update.
      - record: job:book_update_latency_ns:p50
        expr: histogram_quantile(0.50, sum by (job, le) (rate(book_update_latency_ns_bucket[5m])))
      - record: job:book_update_latency_ns:p99
        expr: histogram_quantile(0.99, sum by (job, le) (rate(book_update_latency_ns_bucket[5m])))
      - record: job:book_update_latency_ns:p999
        expr: histogram_quantile(0.999, sum by (job, le) (rate(book_update_latency_ns_bucket[5m])))

      # Decision-to-wire order path (includes the pre-trade risk check).
      - record: job:order_path_latency_ns:p50
        expr: histogram_quantile(0.50, sum by (job, le) (rate(order_path_latency_ns_bucket[5m])))
      - record: job:order_path_latency_ns:p99
        expr: histogram_quantile(0.99, sum by (job, le) (rate(order_path_latency_ns_bucket[5m])))
      - record: job:order_path_latency_ns:p999
        expr: histogram_quantile(0.999, sum by (job, le) (rate(order_path_latency_ns_bucket[5m])))

      # Execution slippage |fill - mark|, basis points x100 (integer-scaled
      # into the log2 histogram; divide by 100 for bps).
      - record: job:exec_slippage_bps_x100:p50
        expr: histogram_quantile(0.50, sum by (job, le) (rate(exec_slippage_bps_bucket[5m])))
      - record: job:exec_slippage_bps_x100:p99
        expr: histogram_quantile(0.99, sum by (job, le) (rate(exec_slippage_bps_bucket[5m])))

      # JVM GC pause (LIVE from java: jvm_gc_pause_ns, registered at the
      # first observed pause).
      - record: job:jvm_gc_pause_ns:p99
        expr: histogram_quantile(0.99, sum by (job, le) (rate(jvm_gc_pause_ns_bucket[5m])))
