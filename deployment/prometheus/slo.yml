# =============================================================================
# slo.yml — latency SLO with multi-window, multi-burn-rate alerts (v1.12.0,
# plan P4; Google SRE Workbook ch. 5 "Alerting on SLOs").
#
# Source metric: the log2 histogram the Python platform-metrics process
# exports (PLATFORM_CONVENTIONS.md §12.6; python/src/iap/metrics/exporter.py)
# — bucket upper bounds are 2^i - 1 ns, so an SLO threshold MUST be one of
# those bounds. The SLO uses le="1048575" (2^20 - 1 ns ~= 1.05 ms): the
# nearest bound above the measured cold p99 of the event path
# (<= 524,287 ns, benchmarks/RESULTS.md).
#
#   SLO                  objective                                 metric
#   order-path-latency   99% of parents decision->arrival < 1.05 ms  order_path_latency_ns
#   window: 30 days rolling; error budget 1%.
#
# RETIRED (v1.17 F9, with the Java image): the event-path-latency SLO on
# book_update_latency_ns. The Python exporter reads the MVP run's artefacts;
# the per-event book-apply latency was a Java in-process histogram and has no
# Python producer (the name is exposed as book_update_latency_ns_available 0).
#
# error ratio(W) = 1 - good(W) / total(W)
#   good  = rate(<metric>_bucket{le="1048575"}[W])
#   total = rate(<metric>_count[W])
# With no traffic the ratio is NaN and nothing fires (a finite session that
# has ended is not an SLO breach; liveness alerts cover a dead feed).
#
# Burn-rate alerts (budget 0.01):
#   *LatencySLOFastBurn  page     14.4x over 1h AND 5m   (2% of budget / 1h)
#                                 6x    over 6h AND 30m  (5% of budget / 6h)
#   *LatencySLOSlowBurn  warning  3x    over 1d AND 2h   (10% of budget / 1d)
#                                 1x    over 3d AND 6h   (10% of budget / 3d)
# Alertmanager inhibits the warning while the page for the same `slo` and
# `service` fires (deployment/alertmanager/alertmanager.yml).
#
# Caveat (documented, not hidden): the histogram is rebuilt from the newest
# run's traces on every scrape, so it is cumulative per run; a new run
# resets it, which rate() handles. Clock-quantisation: a log2 bucket means
# "< 1.05 ms" is exact at the bound — no interpolation is involved.
# Unit tests: deployment/prometheus/tests/slo_test.yml (promtool, CI).
# =============================================================================

groups:
  - name: iap-slo-order-path-latency-recording
    interval: 30s
    rules:
      - record: job:order_path_latency_slo_errors:ratio_rate5m
        expr: >-
          1 - (
            sum by (job, service) (rate(order_path_latency_ns_bucket{le="1048575"}[5m]))
            /
            sum by (job, service) (rate(order_path_latency_ns_count[5m]))
          )
      - record: job:order_path_latency_slo_errors:ratio_rate30m
        expr: >-
          1 - (
            sum by (job, service) (rate(order_path_latency_ns_bucket{le="1048575"}[30m]))
            /
            sum by (job, service) (rate(order_path_latency_ns_count[30m]))
          )
      - record: job:order_path_latency_slo_errors:ratio_rate1h
        expr: >-
          1 - (
            sum by (job, service) (rate(order_path_latency_ns_bucket{le="1048575"}[1h]))
            /
            sum by (job, service) (rate(order_path_latency_ns_count[1h]))
          )
      - record: job:order_path_latency_slo_errors:ratio_rate2h
        expr: >-
          1 - (
            sum by (job, service) (rate(order_path_latency_ns_bucket{le="1048575"}[2h]))
            /
            sum by (job, service) (rate(order_path_latency_ns_count[2h]))
          )
      - record: job:order_path_latency_slo_errors:ratio_rate6h
        expr: >-
          1 - (
            sum by (job, service) (rate(order_path_latency_ns_bucket{le="1048575"}[6h]))
            /
            sum by (job, service) (rate(order_path_latency_ns_count[6h]))
          )
      - record: job:order_path_latency_slo_errors:ratio_rate1d
        expr: >-
          1 - (
            sum by (job, service) (rate(order_path_latency_ns_bucket{le="1048575"}[1d]))
            /
            sum by (job, service) (rate(order_path_latency_ns_count[1d]))
          )
      - record: job:order_path_latency_slo_errors:ratio_rate3d
        expr: >-
          1 - (
            sum by (job, service) (rate(order_path_latency_ns_bucket{le="1048575"}[3d]))
            /
            sum by (job, service) (rate(order_path_latency_ns_count[3d]))
          )
  - name: iap-slo-order-path-latency-alerts
    rules:
      - alert: OrderPathLatencySLOFastBurn
        expr: >-
          (
            job:order_path_latency_slo_errors:ratio_rate1h > (14.4 * 0.01)
            and job:order_path_latency_slo_errors:ratio_rate5m > (14.4 * 0.01)
          )
          or
          (
            job:order_path_latency_slo_errors:ratio_rate6h > (6 * 0.01)
            and job:order_path_latency_slo_errors:ratio_rate30m > (6 * 0.01)
          )
        for: 2m
        labels:
          severity: page
          domain: latency
          slo: order-path-latency
        annotations:
          summary: "order-path-latency SLO fast burn on {{ $labels.service }}"
          description: >-
            The decision-to-wire order path (incl. the pre-trade risk check) is burning its 30-day error budget (99% under
            1.05 ms) at 6x or more: at this rate the budget is gone in days.
            Check job:order_path_latency_ns:p99 and the venue latency realism
            of the run (configs/prereg/v3.json). Runbook: docs/RUNBOOKS.md#latency-slo
          runbook: docs/RUNBOOKS.md
          runbook_url: docs/RUNBOOKS.md#latency-slo

      - alert: OrderPathLatencySLOSlowBurn
        expr: >-
          (
            job:order_path_latency_slo_errors:ratio_rate1d > (3 * 0.01)
            and job:order_path_latency_slo_errors:ratio_rate2h > (3 * 0.01)
          )
          or
          (
            job:order_path_latency_slo_errors:ratio_rate3d > (1 * 0.01)
            and job:order_path_latency_slo_errors:ratio_rate6h > (1 * 0.01)
          )
        for: 30m
        labels:
          severity: warning
          domain: latency
          slo: order-path-latency
        annotations:
          summary: "order-path-latency SLO slow burn on {{ $labels.service }}"
          description: >-
            The decision-to-wire order path (incl. the pre-trade risk check) is consuming its 30-day error budget (99% under
            1.05 ms) faster than it accrues. Not urgent; investigate the same
            day. Runbook: docs/RUNBOOKS.md#latency-slo
          runbook: docs/RUNBOOKS.md
          runbook_url: docs/RUNBOOKS.md#latency-slo
