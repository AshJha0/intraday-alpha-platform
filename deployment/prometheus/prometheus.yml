# =============================================================================
# prometheus.yml — Intraday Alpha Platform scrape configuration (spec §25)
#
# ONE source of metrics: the Python platform-metrics process
# (`python -m iap.metrics serve`, python/src/iap/metrics/) on port 8080,
# GET /metrics, Prometheus text exposition — plus Prometheus's own
# self-scrape. v1.17 (WS-F item F9, DECISION_N7): it replaces the Java
# platform's com.iap.api.MetricsServer and the java-platform-state exporter
# (both served by the retired java image); the persisted session state is
# served from the same port, so the second job is gone.
#
# The `rust-telemetry` file-SD job was REMOVED (round-3 PLATFORM finding
# SEV-2): no Rust component ever wrote /data/telemetry/rust.prom, so the
# target was permanently down, `TargetDown` (critical) fired continuously, and
# every rule/panel built on venue_* was empty. Execution monitoring comes
# from the platform's own exec_* counters (PLATFORM_CONVENTIONS.md §12.6);
# deployment/grafana/README.md records what is scraped today. Re-add a job
# here only together with a producer that actually writes the metrics.
#
# Metric-name conventions (see deployment/grafana/README.md for the full
# mapping): snake_case, counters end in _total, latency histograms end in _ns
# (fixed log2 buckets: _bucket{le="2^i - 1"}, powers of two in nanoseconds).
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: intraday-alpha
    env: local

rule_files:
  - /etc/prometheus/recording.yml
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml

# Alert delivery: Alertmanager (deployment/alertmanager/). The same hostname
# resolves in docker-compose (service name) and Kubernetes (Service name).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The Python platform-metrics process (port 8080, /metrics — LIVE, served
  # by `python -m iap.metrics serve`): the live risk limits, the session
  # marker (platform_persisted_session_state) and the newest MVP run.
  - job_name: platform-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["platform-metrics:8080"]
        labels:
          service: platform-metrics
          language: python

  # Prometheus self-scrape (rule/alert health).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
