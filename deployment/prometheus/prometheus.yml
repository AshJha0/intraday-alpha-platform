# =============================================================================
# prometheus.yml — Intraday Alpha Platform scrape configuration (spec §25)
#
# Two sources of metrics:
#   1. java-platform  — com.iap.monitoring registry served by
#      com.iap.api.MetricsServer (LIVE), port 8080, GET /metrics,
#      Prometheus text exposition.
#   2. rust telemetry — rust/telemetry Registry::to_prometheus() text written
#      by replay/risk/venue components to a file (/data/telemetry/rust.prom)
#      and served by the rust-telemetry-exporter sidecar. Discovered via a
#      FILE-BASED target list (targets/rust-telemetry.json) so operators can
#      re-point it without reloading this config.
#
# Metric-name conventions (see deployment/grafana/README.md for the full
# mapping): snake_case, counters end in _total, latency histograms end in _ns
# (fixed log2 buckets: _bucket{le="2^i - 1"}, powers of two in nanoseconds).
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: intraday-alpha
    env: local

rule_files:
  - /etc/prometheus/recording.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Java platform monitoring API (port 8080, /metrics — LIVE, served by
  # com.iap.api.MetricsServer).
  - job_name: java-platform
    metrics_path: /metrics
    static_configs:
      - targets: ["java-platform:8080"]
        labels:
          service: java-platform
          language: java

  # Rust telemetry: file-based service discovery pointing at the sidecar that
  # serves rust/telemetry text exposition from the shared data volume.
  - job_name: rust-telemetry
    metrics_path: /rust.prom
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/rust-telemetry.json
        refresh_interval: 30s

  # Prometheus self-scrape (rule/alert health).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
