# =============================================================================
# prometheus.yml — Intraday Alpha Platform scrape configuration (spec §25)
#
# ONE source of metrics today: the Java platform (com.iap.monitoring registry
# served by com.iap.api.MetricsServer) on port 8080, GET /metrics, Prometheus
# text exposition — plus Prometheus's own self-scrape.
#
# The `rust-telemetry` file-SD job was REMOVED (round-3 PLATFORM finding
# SEV-2): no Rust component ever wrote /data/telemetry/rust.prom, so the
# target was permanently down, `TargetDown` (critical) fired continuously, and
# every rule/panel built on venue_* was empty. Execution monitoring now comes
# from the platform's own exec_* counters (PLATFORM_CONVENTIONS.md §12.6);
# deployment/grafana/README.md records what is scraped today. Re-add a job
# here only together with a producer that actually writes the metrics.
#
# Metric-name conventions (see deployment/grafana/README.md for the full
# mapping): snake_case, counters end in _total, latency histograms end in _ns
# (fixed log2 buckets: _bucket{le="2^i - 1"}, powers of two in nanoseconds).
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: intraday-alpha
    env: local

rule_files:
  - /etc/prometheus/recording.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Java platform monitoring API (port 8080, /metrics — LIVE, served by
  # com.iap.api.MetricsServer).
  - job_name: java-platform
    metrics_path: /metrics
    static_configs:
      - targets: ["java-platform:8080"]
        labels:
          service: java-platform
          language: java

  # Prometheus self-scrape (rule/alert health).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
