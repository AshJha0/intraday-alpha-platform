# Grafana datasource provisioning — Prometheus (deployment/prometheus/).
# uid "prometheus" is referenced by every panel in deployment/grafana/dashboards.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s   # matches prometheus global.scrape_interval
