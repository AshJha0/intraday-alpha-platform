[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iap"
version = "1.17.1"
description = "Intraday Alpha Platform - Python reference implementation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4,<3",
  "pandas>=3.0,<4",
  "scipy>=1.17,<2",
  "scikit-learn>=1.9,<2",
  "pyarrow>=25,<26",
  "jsonschema>=4.26,<5",
  "referencing>=0.37,<1",
  "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
ml = ["xgboost", "lightgbm"]
# v1.11 LLM research agent (iap.llm); tests and CI use a scripted client, not the SDK
llm = ["anthropic>=1.14.0,<2"]
# v1.15 DBN MBO reader (ingest --format dbn-mbo): the Databento codec only, no network
dbn = ["databento-dbn>=0.71.0,<1"]
# tools/r7_databento_fetch.py only (the network client; never imported by iap)
databento = ["databento>=0.87.0,<1"]
# v1.15 AI4 deep LOB models (iap.models.deeplob_torch); CI does not install it, tests skip
deep = ["torch>=2.2"]
dev = ["pytest>=9.1,<10", "pytest-cov>=7.1,<8", "pytest-xdist>=3.8,<4", "pyyaml>=6.0,<7"]

[project.scripts]
iap-marketdata = "iap.marketdata.__main__:main"
iap-features = "iap.features.__main__:main"
iap-tca = "iap.tca.__main__:main"
iap-research = "iap.research.__main__:main"
iap-lifecycle = "iap.lifecycle.__main__:main"
iap-store = "iap.store.__main__:main"
iap-mvp = "iap.mvp.__main__:main"
iap-mcp = "iap.agents.mcp_server:main"
iap-mcp-agent = "iap.agents.mcp_workflow:main"
iap-agents = "iap.agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running test file (the CI python-slow job runs these; the PR python job runs -m 'not slow')",
]

# Advisory static typing (v1.13, E-P1-5).  CI runs `mypy` from python/ with
# this config, continue-on-error, and puts the error count in the job
# summary; the path to blocking is in CONTRIBUTING.md.
[tool.mypy]
python_version = "3.12"  # numpy 2.4 stubs use PEP 695 `type` statements
mypy_path = "src"
files = [
  "src/iap/core",
  "src/iap/orderbook",
  "src/iap/execution",
  "src/iap/backtest",
  "src/iap/features",
  # v1.17 F3: the agent, LLM, MVP and paper-trading packages joined the scope
  "src/iap/agents",
  "src/iap/llm",
  "src/iap/mvp",
  "src/iap/paper",
]
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
