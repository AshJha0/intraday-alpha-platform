[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iap"
version = "1.12.0"
description = "Intraday Alpha Platform - Python reference implementation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.4,<3",
  "pandas>=3.0,<4",
  "scipy>=1.17,<2",
  "scikit-learn>=1.9,<2",
  "pyarrow>=25,<26",
  "jsonschema>=4.26,<5",
  "referencing>=0.37,<1",
  "cryptography>=46,<51",
]

[project.optional-dependencies]
ml = ["xgboost", "lightgbm"]
# v1.11 LLM research agent (iap.llm); tests and CI use a scripted client, not the SDK
llm = ["anthropic>=1.12.0,<2"]
dev = ["pytest>=9.1,<10", "pytest-cov>=7.1,<8", "pytest-xdist>=3.8,<4", "pyyaml>=6.0,<7"]

[project.scripts]
iap-marketdata = "iap.marketdata.__main__:main"
iap-features = "iap.features.__main__:main"
iap-tca = "iap.tca.__main__:main"
iap-research = "iap.research.__main__:main"
iap-lifecycle = "iap.lifecycle.__main__:main"
iap-store = "iap.store.__main__:main"
iap-mvp = "iap.mvp.__main__:main"
iap-mcp = "iap.agents.mcp_server:main"
iap-agents = "iap.agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running test file (the CI python-slow job runs these; the PR python job runs -m 'not slow')",
]

# Advisory static typing (v1.13, E-P1-5).  CI runs `mypy` from python/ with
# this config, continue-on-error, and puts the error count in the job
# summary; the path to blocking is in CONTRIBUTING.md.
[tool.mypy]
python_version = "3.12"  # numpy 2.4 stubs use PEP 695 `type` statements
mypy_path = "src"
files = [
  "src/iap/core",
  "src/iap/orderbook",
  "src/iap/execution",
  "src/iap/backtest",
  "src/iap/features",
]
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
